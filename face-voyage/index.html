<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #02030a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #02030a;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #gl {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #flash {
        background: #fff6e8;
        opacity: 0;
      }
      #heat {
        background: radial-gradient(ellipse 70% 55% at 50% 52%, rgba(255, 140, 40, 0) 30%, rgba(255, 90, 20, 0.55) 100%);
        opacity: 0;
        mix-blend-mode: screen;
      }
      #vignette {
        background: radial-gradient(ellipse 80% 70% at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.5) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24"
      data-width="1080"
      data-height="1920"
    >
      <div id="stage" class="clip" data-start="0" data-duration="24" data-track-index="0">
        <canvas id="gl" width="1080" height="1920"></canvas>
        <div id="heat" class="layer"></div>
        <div id="vignette" class="layer"></div>
        <div id="flash" class="layer"></div>
      </div>
      <audio id="soundtrack" src="assets/soundtrack.mp3" data-start="0" data-duration="24" data-track-index="1" data-volume="1"></audio>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      const W = 1080;
      const H = 1920;
      const DURATION = 24;
      const T_CITY = 17.0;
      const T_LAND = 19.5;

      const clamp01 = (v) => Math.min(1, Math.max(0, v));
      const smooth = (v) => {
        const x = clamp01(v);
        return x * x * (3 - 2 * x);
      };
      const win = (t, a, b) => smooth((t - a) / (b - a));
      const lerp = (a, b, k) => a + (b - a) * k;
      const easeIn = (v) => clamp01(v) ** 2.2;
      function rng(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const noise = (t, s) => 0.5 * Math.sin(t * 7.1 + s) + 0.3 * Math.sin(t * 13.3 + s * 1.9) + 0.2 * Math.sin(t * 21.7 + s * 3.1);

      // ---------------- renderer ----------------
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      function canvasTex(w, h, draw) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        draw(c.getContext("2d"), w, h);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = 4;
        return t;
      }
      const glowTex = canvasTex(128, 128, (g) => {
        const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
        gr.addColorStop(0, "rgba(255,255,255,1)");
        gr.addColorStop(0.35, "rgba(255,255,255,0.35)");
        gr.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = gr;
        g.fillRect(0, 0, 128, 128);
      });
      const glow = (color, size, opacity) => {
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false }));
        s.scale.set(size, size, 1);
        return s;
      };

      // the traveller: the face, a camera-facing sprite
      const faceTex = new THREE.TextureLoader().load("assets/face.png");
      faceTex.colorSpace = THREE.SRGBColorSpace;
      const FACE_ASPECT = 859 / 1292;
      function makeFace() {
        const m = new THREE.SpriteMaterial({ map: faceTex, transparent: true, depthWrite: false, toneMapped: false });
        const s = new THREE.Sprite(m);
        return s;
      }

      // ============================ SPACE ============================
      const space = new THREE.Scene();
      space.background = new THREE.Color(0x02030a);
      const camS = new THREE.PerspectiveCamera(55, W / H, 0.1, 2000);
      space.add(camS);
      space.add(new THREE.AmbientLight(0x30364a, 0.6));
      const sunLight = new THREE.DirectionalLight(0xfff2e0, 3.0);
      sunLight.position.set(30, 12, 10);
      space.add(sunLight);

      // star streaks (wrap along z, deterministic)
      const SR = rng(4);
      const STARS = 2600;
      const STAR_L = 400;
      const starBase = [];
      for (let i = 0; i < STARS; i++) {
        const a = SR() * Math.PI * 2;
        const r = 6 + SR() * 70;
        starBase.push([Math.cos(a) * r, Math.sin(a) * r * 1.4, -SR() * STAR_L, 0.5 + SR() * 0.5]);
      }
      const starGeo = new THREE.BufferGeometry();
      const starPos = new Float32Array(STARS * 6);
      const starCol = new Float32Array(STARS * 6);
      starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
      starGeo.setAttribute("color", new THREE.BufferAttribute(starCol, 3));
      const stars = new THREE.LineSegments(starGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, toneMapped: false }));
      space.add(stars);
      const speedAt = (t) => lerp(70, 26, win(t, 0, 2.2)) + 30 * win(t, 12, 15.5);
      function travelled(t) {
        // integral of speedAt, sampled (deterministic)
        let d = 0;
        const steps = 120;
        for (let k = 0; k < steps; k++) d += speedAt((t * (k + 0.5)) / steps) * (t / steps);
        return d;
      }
      function updateStars(t) {
        const d = travelled(t);
        const len = 0.6 + speedAt(t) * 0.05;
        for (let i = 0; i < STARS; i++) {
          const [x, y, z0, b] = starBase[i];
          let z = ((((z0 + d) % STAR_L) + STAR_L) % STAR_L) - STAR_L;
          const k = i * 6;
          starPos[k] = x;
          starPos[k + 1] = y;
          starPos[k + 2] = z;
          starPos[k + 3] = x;
          starPos[k + 4] = y;
          starPos[k + 5] = z - len;
          const fade = smooth((z + STAR_L) / 60) * b;
          for (let c = 0; c < 3; c++) {
            starCol[k + c] = fade * 1.6;
            starCol[k + 3 + c] = 0;
          }
        }
        starGeo.attributes.position.needsUpdate = true;
        starGeo.attributes.color.needsUpdate = true;
      }

      // procedural planet textures
      const PR = rng(9);
      const bands = (cols, spot) =>
        canvasTex(1024, 512, (g, w, h) => {
          for (let y = 0; y < h; y++) {
            const v = y / h;
            const k = 0.5 + 0.5 * Math.sin(v * 38 + Math.sin(v * 11) * 2.2) * Math.cos(v * 9);
            const i = Math.floor(k * (cols.length - 1));
            g.fillStyle = cols[i];
            g.fillRect(0, y, w, 1);
          }
          for (let k = 0; k < 900; k++) {
            g.fillStyle = "rgba(255,255,255," + (PR() * 0.05).toFixed(3) + ")";
            g.fillRect(PR() * w, PR() * h, 30 + PR() * 120, 1 + PR() * 2);
          }
          if (spot) {
            g.fillStyle = "rgba(190,80,50,0.9)";
            g.beginPath();
            g.ellipse(w * 0.62, h * 0.62, 70, 34, 0, 0, Math.PI * 2);
            g.fill();
          }
        });
      const planet = (radius, tex, extra = {}) =>
        new THREE.Mesh(new THREE.SphereGeometry(radius, 96, 64), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9, metalness: 0, ...extra }));

      const saturn = planet(9, bands(["#d9c39a", "#c8ab7a", "#e8d7b0", "#b8955f", "#efe2c2"]));
      saturn.rotation.z = 0.35;
      const ringTex = canvasTex(1024, 8, (g, w) => {
        for (let x = 0; x < w; x++) {
          const u = x / w;
          const a = (0.35 + 0.65 * Math.abs(Math.sin(u * 47) * Math.sin(u * 13))) * smooth(u / 0.08) * smooth((1 - u) / 0.05) * (u > 0.55 && u < 0.6 ? 0.15 : 1);
          g.fillStyle = "rgba(225,205,165," + a.toFixed(3) + ")";
          g.fillRect(x, 0, 1, 8);
        }
      });
      const ringGeo = new THREE.RingGeometry(11, 20, 160, 1);
      const rpos = ringGeo.attributes.position;
      const ruv = ringGeo.attributes.uv;
      for (let i = 0; i < rpos.count; i++) {
        const r = Math.hypot(rpos.getX(i), rpos.getY(i));
        ruv.setXY(i, (r - 11) / 9, 0.5);
      }
      const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ map: ringTex, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
      ring.rotation.x = -Math.PI / 2 + 0.38;
      ring.rotation.y = 0.2;
      const saturnG = new THREE.Group();
      saturnG.add(saturn, ring);
      space.add(saturnG);

      const jupiter = planet(14, bands(["#c99c6e", "#e7cfa8", "#a8714a", "#f1e3c8", "#b9835a"], true));
      space.add(jupiter);
      const moon = planet(1.6, bands(["#9a9a9a", "#b8b8b8", "#7d7d7d"]));
      space.add(moon);

      const marsTex = canvasTex(1024, 512, (g, w, h) => {
        g.fillStyle = "#b5532e";
        g.fillRect(0, 0, w, h);
        for (let k = 0; k < 2200; k++) {
          const c = PR() < 0.5 ? "rgba(120,40,20," : "rgba(220,120,70,";
          g.fillStyle = c + (PR() * 0.25).toFixed(3) + ")";
          g.beginPath();
          g.arc(PR() * w, PR() * h, 2 + PR() * 26, 0, Math.PI * 2);
          g.fill();
        }
        g.fillStyle = "rgba(255,250,245,0.85)";
        g.fillRect(0, 0, w, 22);
      });
      const mars = planet(5, marsTex);
      space.add(mars);

      // asteroids
      const asteroids = [];
      const AR = rng(21);
      for (let k = 0; k < 26; k++) {
        const g = new THREE.IcosahedronGeometry(0.25 + AR() * 0.7, 0);
        const p = g.attributes.position;
        for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) * (0.8 + AR() * 0.4), p.getY(i) * (0.8 + AR() * 0.4), p.getZ(i));
        g.computeVertexNormals();
        const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x7b6e62, roughness: 1, flatShading: true }));
        m.userData = { x: (AR() - 0.5) * 30, y: (AR() - 0.5) * 40, z0: -60 - AR() * 140, spin: AR() * 2 };
        asteroids.push(m);
        space.add(m);
      }

      // Earth with clouds + atmosphere
      const ER = rng(31);
      const earthTex = canvasTex(2048, 1024, (g, w, h) => {
        g.fillStyle = "#1d4f8f";
        g.fillRect(0, 0, w, h);
        const blobs = [];
        for (let k = 0; k < 18; k++) blobs.push([ER() * w, h * (0.2 + ER() * 0.6), 60 + ER() * 220]);
        blobs.forEach(([x, y, r]) => {
          for (let j = 0; j < 40; j++) {
            const a = ER() * Math.PI * 2;
            const d = ER() * r;
            g.fillStyle = ER() < 0.7 ? "#3f7a3a" : "#8c7a4a";
            g.beginPath();
            g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.7, 18 + ER() * r * 0.45, 0, Math.PI * 2);
            g.fill();
          }
        });
        g.fillStyle = "#f4f6f8";
        g.fillRect(0, 0, w, 40);
        g.fillRect(0, h - 40, w, 40);
      });
      const cloudTex = canvasTex(2048, 1024, (g, w, h) => {
        g.clearRect(0, 0, w, h);
        for (let k = 0; k < 520; k++) {
          g.fillStyle = "rgba(255,255,255," + (0.15 + ER() * 0.3).toFixed(3) + ")";
          g.beginPath();
          g.ellipse(ER() * w, h * (0.1 + ER() * 0.8), 30 + ER() * 140, 8 + ER() * 30, 0, 0, Math.PI * 2);
          g.fill();
        }
      });
      const earth = planet(26, earthTex, { roughness: 0.7 });
      const clouds = new THREE.Mesh(new THREE.SphereGeometry(26.4, 96, 64), new THREE.MeshStandardMaterial({ map: cloudTex, transparent: true, depthWrite: false }));
      const atmo = glow(0x6fb6ff, 70, 0.55);
      const earthG = new THREE.Group();
      earthG.add(atmo, earth, clouds);
      space.add(earthG);

      // the face in space, in front of the camera
      const faceS = makeFace();
      camS.add(faceS);
      const faceGlow = glow(0xffa040, 3.2, 0);
      camS.add(faceGlow);
      const fire = [];
      for (let k = 0; k < 14; k++) {
        const f = glow(k % 3 ? 0xff7a20 : 0xffd27a, 1.4, 0);
        camS.add(f);
        fire.push(f);
      }

      // planet fly-bys: [object, x, y, zStart, zEnd, t0, t1]
      const PASSES = [
        [saturnG, -11, 6, -260, 40, 0.6, 5.2],
        [jupiter, 17, 4, -320, 50, 4.4, 9.0],
        [moon, -6, 10, -200, 40, 5.4, 9.2],
        [mars, -7, 5, -220, 40, 8.3, 11.8],
      ];
      function placePasses(t) {
        PASSES.forEach(([o, x, y, z0, z1, t0, t1]) => {
          const k = clamp01((t - t0) / (t1 - t0));
          o.position.set(x, y, lerp(z0, z1, k * k * 0.35 + k * 0.65));
          o.visible = t > t0 - 0.5 && t < t1 + 0.3;
          o.rotation.y = t * 0.15;
        });
        asteroids.forEach((a) => {
          const z = a.userData.z0 + Math.max(0, t - 9.6) * 75;
          a.position.set(a.userData.x, a.userData.y, z);
          a.rotation.set(t * a.userData.spin, t * 0.7 * a.userData.spin, 0);
          a.visible = t > 9.6 && t < 13 && z < 5;
        });
        // Earth: grows from a dot to the whole screen
        const ek = win(t, 11.4, 16.6);
        earthG.position.set(lerp(6, 0, ek), lerp(-4, -18, ek), lerp(-700, -46, Math.pow(ek, 1.6)));
        earth.rotation.y = 1.2 + t * 0.05;
        clouds.rotation.y = 1.25 + t * 0.07;
        earthG.visible = t > 11.2;
      }
      function renderSpace(t) {
        updateStars(t);
        placePasses(t);
        // camera: gentle drift + shake during the entry
        const shake = win(t, 15.0, 16.0) * 0.06;
        camS.position.set(0.3 * Math.sin(t * 0.6) + shake * noise(t * 3, 1), 0.2 * Math.sin(t * 0.5) + shake * noise(t * 3, 2), 0);
        camS.rotation.set(0, 0, 0.05 * Math.sin(t * 0.4));
        // the face: arrives from the depth, then cruises, then dives
        const arrive = smooth((t - 0.1) / 1.6);
        const fz = lerp(-60, -4.2, arrive);
        const dive = win(t, 14.5, 16.8);
        const s = lerp(1.0, 1.25, dive);
        faceS.position.set(0.12 * Math.sin(t * 1.3), -0.55 + 0.1 * Math.sin(t * 1.7) - 0.15 * dive, fz);
        faceS.scale.set(1.35 * FACE_ASPECT * s, 1.35 * s, 1);
        faceS.material.rotation = 0.12 * Math.sin(t * 1.1) + 0.3 * Math.sin(t * 0.37) * (1 - dive) + 0.15 * win(t, 2, 4) * Math.sin(t * 2.3);
        // entry fire
        const burn = win(t, 15.0, 15.8);
        faceGlow.position.copy(faceS.position).add(new THREE.Vector3(0, 0.3, -0.05));
        faceGlow.material.opacity = 0.8 * burn;
        fire.forEach((f, k) => {
          const ph = (t * 2.2 + k / fire.length) % 1;
          const a = (k / fire.length) * Math.PI * 2;
          f.position.set(faceS.position.x + Math.cos(a) * 0.95 * (1 - ph * 0.3), faceS.position.y + 0.4 + ph * 2.0 + Math.sin(a) * 0.4, faceS.position.z - 0.1);
          f.scale.setScalar((1.6 - ph) * 0.9 * (1 + 0.3 * noise(t, k)));
          f.material.opacity = burn * (1 - ph) * 0.9;
        });
        document.getElementById("heat").style.opacity = String(burn * (0.75 + 0.25 * noise(t * 2, 4)));
      }

      // ============================ CITY ============================
      const city = new THREE.Scene();
      city.background = new THREE.Color(0x0b1024);
      city.fog = new THREE.Fog(0x0b1024, 25, 90);
      const camC = new THREE.PerspectiveCamera(50, W / H, 0.1, 400);
      city.add(new THREE.HemisphereLight(0x45528a, 0x1a1410, 0.9));
      const moonLight = new THREE.DirectionalLight(0x8fa6ff, 0.6);
      moonLight.position.set(-10, 20, 10);
      city.add(moonLight);

      // night sky stars
      const skyStars = new THREE.Points(
        (() => {
          const g = new THREE.BufferGeometry();
          const p = new Float32Array(900 * 3);
          const r = rng(77);
          for (let i = 0; i < 900; i++) {
            p[i * 3] = (r() - 0.5) * 300;
            p[i * 3 + 1] = 40 + r() * 120;
            p[i * 3 + 2] = -120 - r() * 60;
          }
          g.setAttribute("position", new THREE.BufferAttribute(p, 3));
          return g;
        })(),
        new THREE.PointsMaterial({ color: 0xcfd8ff, size: 0.6, fog: false }),
      );
      city.add(skyStars);

      // street + sidewalk
      const asphalt = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x1b1d24, roughness: 0.35, metalness: 0.3 }));
      asphalt.rotation.x = -Math.PI / 2;
      city.add(asphalt);
      const sidewalk = new THREE.Mesh(new THREE.BoxGeometry(60, 0.18, 7), new THREE.MeshStandardMaterial({ color: 0x5a5650, roughness: 0.8 }));
      sidewalk.position.set(0, 0.09, -3.5);
      city.add(sidewalk);
      for (let k = -14; k <= 14; k++) {
        const line = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.19, 7), new THREE.MeshStandardMaterial({ color: 0x46433e }));
        line.position.set(k * 1.6, 0.09, -3.5);
        city.add(line);
      }

      // the massage parlour facade (canvas)
      const facadeTex = canvasTex(1600, 2000, (g, w, h) => {
        // wall
        g.fillStyle = "#3b2a26";
        g.fillRect(0, 0, w, h);
        for (let y = 0; y < h; y += 50)
          for (let x = (y / 50) % 2 ? 0 : 60; x < w; x += 120) {
            g.fillStyle = "rgba(0,0,0,0.12)";
            g.fillRect(x, y, 118, 2);
            g.fillRect(x, y, 2, 50);
          }
        // upper floor windows
        for (let i = 0; i < 3; i++) {
          g.fillStyle = "#2a1c18";
          g.fillRect(170 + i * 470, 120, 320, 360);
          g.fillStyle = "rgba(255,190,120,0.55)";
          g.fillRect(190 + i * 470, 140, 280, 320);
          g.fillStyle = "#2a1c18";
          g.fillRect(325 + i * 470, 140, 10, 320);
        }
        // sign board
        g.fillStyle = "#7a0d12";
        g.fillRect(60, 600, w - 120, 330);
        g.strokeStyle = "#d9a441";
        g.lineWidth = 14;
        g.strokeRect(80, 620, w - 160, 290);
        // shopfront
        g.fillStyle = "#1a0f0e";
        g.fillRect(60, 1000, w - 120, 1000);
        // windows glowing warm with a curtain
        const win2 = (x, y, ww, hh) => {
          const gr = g.createLinearGradient(x, y, x, y + hh);
          gr.addColorStop(0, "#ffcf8a");
          gr.addColorStop(1, "#ff9a5a");
          g.fillStyle = gr;
          g.fillRect(x, y, ww, hh);
          g.fillStyle = "rgba(140,20,30,0.85)";
          g.fillRect(x, y, ww, 90);
          for (let k = 0; k < ww; k += 40) {
            g.fillStyle = "rgba(90,10,20,0.6)";
            g.fillRect(x + k, y, 18, 90);
          }
          // bamboo silhouettes
          g.strokeStyle = "rgba(30,60,30,0.85)";
          g.lineWidth = 12;
          for (let k = 0; k < 3; k++) {
            const bx = x + 40 + k * 46;
            g.beginPath();
            g.moveTo(bx, y + hh);
            g.lineTo(bx + 8, y + hh - 360 - k * 40);
            g.stroke();
            g.fillStyle = "rgba(30,70,30,0.85)";
            for (let j = 0; j < 4; j++) {
              g.beginPath();
              g.ellipse(bx + 30, y + hh - 120 - j * 80 - k * 10, 40, 12, -0.5, 0, Math.PI * 2);
              g.fill();
            }
          }
        };
        win2(110, 1100, 470, 720);
        win2(w - 580, 1100, 470, 720);
        // door
        g.fillStyle = "#5a1a14";
        g.fillRect(640, 1080, 320, 920);
        g.fillStyle = "rgba(255,200,140,0.75)";
        g.fillRect(680, 1130, 240, 560);
        g.fillStyle = "#d9a441";
        g.beginPath();
        g.arc(930, 1560, 12, 0, Math.PI * 2);
        g.fill();
        // lotus emblem on the door
        g.strokeStyle = "rgba(140,30,40,0.9)";
        g.lineWidth = 8;
        for (let k = -2; k <= 2; k++) {
          g.beginPath();
          g.ellipse(800 + k * 34, 1400, 22, 64, k * 0.35, 0, Math.PI * 2);
          g.stroke();
        }
      });
      const facade = new THREE.Mesh(new THREE.PlaneGeometry(8, 10), new THREE.MeshStandardMaterial({ map: facadeTex, roughness: 0.85 }));
      facade.position.set(0, 5, -7);
      city.add(facade);

      // neon sign text (emissive, blooms)
      const neonTex = canvasTex(1600, 400, (g, w, h) => {
        g.clearRect(0, 0, w, h);
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.font = "bold 150px 'WenQuanYi Zen Hei', 'Noto Sans CJK SC', sans-serif";
        g.fillStyle = "#ffd36a";
        g.fillText("按摩", w * 0.5, 120);
        g.font = "bold 120px 'DejaVu Sans', sans-serif";
        g.fillStyle = "#ff4f8b";
        g.fillText("MASSAGE", w * 0.5, 290);
      });
      const neonMat = new THREE.MeshBasicMaterial({ map: neonTex, transparent: true, toneMapped: false, color: new THREE.Color(1.6, 1.6, 1.6) });
      const neon = new THREE.Mesh(new THREE.PlaneGeometry(6.8, 1.7), neonMat);
      neon.position.set(0, 7.7, -6.95);
      city.add(neon);
      const neonGlow = glow(0xff5a8a, 9, 0.0);
      neonGlow.position.set(0, 7.6, -6.6);
      city.add(neonGlow);
      const openTex = canvasTex(512, 160, (g, w, h) => {
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.font = "bold 92px 'DejaVu Sans', sans-serif";
        g.fillStyle = "#6bff9a";
        g.fillText("OUVERT", w / 2, h / 2);
      });
      const openSign = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.31), new THREE.MeshBasicMaterial({ map: openTex, transparent: true, toneMapped: false, color: new THREE.Color(1.5, 1.5, 1.5) }));
      openSign.position.set(0, 2.85, -6.94);
      city.add(openSign);
      const shopLight = new THREE.PointLight(0xffa860, 6, 14, 1.5);
      shopLight.position.set(0, 2.5, -5.5);
      city.add(shopLight);

      // red lanterns
      const lanterns = [];
      [-3.2, -1.1, 1.1, 3.2].forEach((x, i) => {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 16), new THREE.MeshStandardMaterial({ color: 0xd11f1f, emissive: 0xc0141a, emissiveIntensity: 1.2, roughness: 0.6 }));
        body.scale.y = 0.85;
        body.position.y = -0.75;
        const cap1 = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.08, 16), new THREE.MeshStandardMaterial({ color: 0xd9a441 }));
        cap1.position.y = -0.46;
        const cap2 = cap1.clone();
        cap2.position.y = -1.03;
        const tassel = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.02, 0.32, 8), new THREE.MeshStandardMaterial({ color: 0xd11f1f }));
        tassel.position.y = -1.22;
        const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.45, 6), new THREE.MeshStandardMaterial({ color: 0x222222 }));
        cord.position.y = -0.22;
        const lg = glow(0xff3a2a, 1.8, 0.45);
        lg.position.y = -0.75;
        g.add(body, cap1, cap2, tassel, cord, lg);
        g.position.set(x, 6.15, -6.6);
        g.userData.ph = i * 1.3;
        city.add(g);
        lanterns.push(g);
      });

      // neighbouring buildings with lit windows
      const BR = rng(55);
      const winTex = canvasTex(256, 512, (g, w, h) => {
        g.fillStyle = "#151827";
        g.fillRect(0, 0, w, h);
        for (let y = 20; y < h; y += 56)
          for (let x = 18; x < w; x += 58) {
            g.fillStyle = BR() < 0.45 ? "rgba(255,210,140," + (0.5 + BR() * 0.5).toFixed(2) + ")" : "#0d0f19";
            g.fillRect(x, y, 34, 36);
          }
      });
      [[-10, 18, 7], [10, 22, 7], [-18, 26, 8], [18, 15, 8], [-26, 30, 7], [26, 24, 7]].forEach(([x, h, w]) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 8), new THREE.MeshStandardMaterial({ map: winTex, emissive: 0xffffff, emissiveMap: winTex, emissiveIntensity: 0.6, roughness: 0.9 }));
        m.position.set(x, h / 2, -11);
        city.add(m);
      });
      // street lamps
      [-6.5, 6.5].forEach((x) => {
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 5, 10), new THREE.MeshStandardMaterial({ color: 0x2a2a30, metalness: 0.6, roughness: 0.4 }));
        pole.position.set(x, 2.5, -1.2);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 12), new THREE.MeshBasicMaterial({ color: 0xfff0c0 }));
        head.position.set(x, 5.05, -1.2);
        const l = new THREE.PointLight(0xffe2a8, 5, 12, 1.6);
        l.position.set(x, 4.9, -1.2);
        const g = glow(0xffe2a8, 2.4, 0.6);
        g.position.copy(head.position);
        city.add(pole, head, l, g);
      });

      // the face in the city
      const faceC = makeFace();
      city.add(faceC);
      const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.75, 32), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.0, depthWrite: false }));
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.set(0, 0.19, -3.3);
      city.add(shadow);
      const dust = [];
      const DR = rng(66);
      for (let k = 0; k < 18; k++) {
        const d = glow(0xb8aea0, 0.9, 0);
        d.material.blending = THREE.NormalBlending;
        d.userData = { a: (k / 18) * Math.PI * 2, s: 0.7 + DR() * 0.6 };
        city.add(d);
        dust.push(d);
      }
      const streak = glow(0xfff2d8, 1.2, 0);
      city.add(streak);

      const FACE_H = 2.0;
      function renderCity(t) {
        const k = t - T_CITY;
        // camera: from high above the rooftops down to street level
        const down = smooth(k / 2.6);
        camC.position.set(0, lerp(46, 1.8, Math.pow(down, 0.8)), lerp(6, 4.6, down));
        const lookY = lerp(0, 3.0, down);
        // landing shake
        const sh = t > T_LAND ? Math.exp(-(t - T_LAND) * 6) * 0.12 : 0;
        camC.position.x += sh * noise(t * 4, 1);
        camC.position.y += sh * noise(t * 4, 2);
        camC.lookAt(0, lookY, -4.5);
        // the face falls and lands, squash and stretch
        const fall = clamp01((t - T_CITY - 0.4) / (T_LAND - T_CITY - 0.4));
        let y = lerp(40, 0.19 + FACE_H / 2, easeIn(fall));
        let sx = 1;
        let sy = 1;
        if (t < T_LAND) {
          sy = 1 + 0.25 * fall;
          sx = 1 - 0.12 * fall;
        } else {
          const u = t - T_LAND;
          const sq = Math.exp(-u * 5) * Math.cos(u * 22);
          sx = 1 + 0.28 * sq;
          sy = 1 - 0.28 * sq;
          y = 0.19 + (FACE_H * sy) / 2 + Math.max(0, 0.35 * Math.sin(u * 9) * Math.exp(-u * 5));
          // a happy little hop once settled
          const hop = win(t, 21.6, 21.9) * (1 - win(t, 21.9, 22.3));
          y += 0.25 * Math.sin(Math.PI * clamp01((t - 21.6) / 0.7));
        }
        faceC.position.set(0, y, -3.3);
        faceC.scale.set(FACE_H * FACE_ASPECT * sx, FACE_H * sy, 1);
        faceC.material.rotation = t < T_LAND ? 0.2 * Math.sin(t * 6) : 0.08 * Math.sin((t - T_LAND) * 1.6) * win(t, 20.3, 21.0) + 0.15 * win(t, 22.6, 23.1) * Math.sin(Math.PI * clamp01((t - 22.6) / 1.2));
        shadow.material.opacity = 0.55 * smooth(fall * 1.2 - 0.2);
        shadow.scale.setScalar(lerp(0.3, 1, fall) * sx);
        streak.position.set(0, y + 2.2, -3.32);
        streak.scale.set(0.6, 5, 1);
        streak.material.opacity = t < T_LAND ? 0.35 * fall : 0;
        // dust ring on impact
        dust.forEach((d) => {
          const u = t - T_LAND;
          const on = u > 0 && u < 1.6;
          const r = 0.4 + 2.2 * (1 - Math.exp(-u * 3)) * d.userData.s;
          d.position.set(Math.cos(d.userData.a) * r, 0.35 + 0.4 * (1 - Math.exp(-u * 2)), -3.3 + Math.sin(d.userData.a) * r * 0.5);
          d.material.opacity = on ? 0.5 * Math.exp(-u * 1.8) : 0;
          d.scale.setScalar(0.8 + u * 0.9);
        });
        // neon flickers on after the landing
        const fl = t < 19.8 ? 0.15 : t < 20.6 ? (Math.sin(t * 61) > 0.1 ? 1 : 0.1) : 1;
        neonMat.color.setScalar(1.7 * fl);
        neonGlow.material.opacity = 0.35 * fl;
        lanterns.forEach((l) => (l.rotation.z = 0.06 * Math.sin(t * 1.3 + l.userData.ph)));
      }

      // ---------------- post ----------------
      function makeComposer(scene, cam, strength) {
        const c = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { samples: 4, type: THREE.HalfFloatType }));
        c.setPixelRatio(1);
        c.setSize(W, H);
        c.addPass(new RenderPass(scene, cam));
        c.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), strength, 0.6, 0.6));
        c.addPass(new OutputPass());
        return c;
      }
      const compSpace = makeComposer(space, camS, 0.7);
      const compCity = makeComposer(city, camC, 0.9);

      const flash = document.getElementById("flash");
      function renderAt(t) {
        t = Math.min(Math.max(t, 0), DURATION);
        if (t < T_CITY) {
          renderSpace(t);
          compSpace.render();
        } else {
          document.getElementById("heat").style.opacity = "0";
          renderCity(t);
          compCity.render();
        }
        flash.style.opacity = String(win(t, 16.5, 17.0) * (1 - win(t, 17.0, 17.6)));
      }

      const clock = gsap.timeline({ paused: true });
      clock.set({}, {}, DURATION);
      window.__timelines["main"] = clock;
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>

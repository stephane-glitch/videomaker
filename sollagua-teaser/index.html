<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Fraunces";
        font-weight: 600;
        font-display: block;
        src: url("assets/fonts/Fraunces-wght-600-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Fraunces";
        font-weight: 700;
        font-display: block;
        src: url("assets/fonts/Fraunces-wght-700-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Nunito";
        font-weight: 600;
        font-display: block;
        src: url("assets/fonts/Nunito-wght-600-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Nunito";
        font-weight: 700;
        font-display: block;
        src: url("assets/fonts/Nunito-wght-700-latin.woff2") format("woff2");
      }

      :root {
        --cream: #fbf4e2;
        --cream-2: #f5e9cd;
        --ink: #3a3024;
        --ink-soft: #6b5d49;
        --water: #2c7fb8;
        --water-light: #5bb5e8;
        --gold: #e0a82e;
        --clay: #b5705c;
        --wine: #7b4b6b;
        --duck: #d98a3d;
        --town: #c77b6b;
        --shadow: 0 8px 28px rgba(80, 60, 30, 0.14);
        --shadow-sm: 0 3px 12px rgba(80, 60, 30, 0.12);
        --radius: 18px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--cream);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--cream);
        font-family: "Nunito", sans-serif;
        color: var(--ink);
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .glyph {
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .center {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ---------- World: the painted board behind a camera ---------- */
      #world {
        overflow: hidden;
      }
      #cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
      }
      #board {
        position: absolute;
        inset: 0;
        isolation: isolate;
      }
      #board-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #grade-multiply {
        position: absolute;
        inset: 0;
        mix-blend-mode: multiply;
        background: linear-gradient(180deg, var(--gold), var(--clay));
      }
      #grade-color {
        position: absolute;
        inset: 0;
        mix-blend-mode: color;
        background: var(--clay);
      }
      .board-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #darken {
        background: var(--ink);
        mix-blend-mode: multiply;
      }
      #sun-glow {
        background: radial-gradient(
          circle at 82% 8%,
          rgba(255, 196, 92, 0.55) 0%,
          rgba(255, 170, 70, 0.18) 30%,
          rgba(255, 170, 70, 0) 60%
        );
        mix-blend-mode: screen;
      }
      #sun {
        position: absolute;
        left: 1500px;
        top: 0;
        width: 200px;
        height: 200px;
        color: #f2c14e;
      }

      /* punch-in medallion (screen space) */
      .punch {
        position: absolute;
        left: 330px;
        top: 780px;
        width: 0;
        height: 0;
      }
      .punch-disc {
        position: absolute;
        left: -78px;
        top: -78px;
        width: 156px;
        height: 156px;
        border-radius: 50%;
        background: var(--cream);
        border: 4px solid currentColor;
        box-shadow: 0 10px 34px rgba(80, 60, 30, 0.28);
      }
      .punch-disc svg {
        width: 76px;
        height: 76px;
      }
      .punch-word {
        position: absolute;
        left: -300px;
        width: 600px;
        top: 96px;
        text-align: center;
      }
      .punch-word span {
        display: inline-block;
        background: rgba(251, 244, 226, 0.94);
        border-radius: 14px;
        padding: 8px 26px 10px;
        font: 700 46px/1.1 "Fraunces", serif;
        color: var(--ink);
        box-shadow: var(--shadow);
      }

      /* role medallions in camera space (plan 4 holds the camera at 1.10) */
      .medal {
        position: absolute;
        width: 0;
        height: 0;
      }
      .medal-disc {
        position: absolute;
        left: -60px;
        top: -60px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: var(--cream);
        border: 3px solid currentColor;
        box-shadow: 0 3px 12px rgba(80, 60, 30, 0.2);
      }
      .medal-disc svg {
        width: 56px;
        height: 56px;
      }

      /* kinetic words */
      .big-word {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font: 700 132px/1 "Fraunces", serif;
        letter-spacing: 0.04em;
        color: var(--cream);
        text-shadow:
          0 4px 18px rgba(40, 28, 16, 0.75),
          0 0 2px rgba(40, 28, 16, 0.9);
      }
      .question {
        position: absolute;
        left: 0;
        right: 0;
        top: 470px;
        display: flex;
        justify-content: center;
      }
      .question span {
        display: block;
        background: rgba(251, 244, 226, 0.95);
        border-radius: 26px;
        padding: 18px 56px 26px;
        font: 700 104px/1 "Fraunces", serif;
        color: var(--ink);
        box-shadow: 0 14px 44px rgba(60, 40, 20, 0.35);
      }

      /* the final question */
      #ask {
        flex-direction: column;
        gap: 34px;
        background: var(--cream);
      }
      #ask-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
      }
      .ask-line {
        font: 600 84px/1.1 "Fraunces", serif;
        color: var(--ink);
        white-space: nowrap;
      }
      .ask-line em {
        font-style: normal;
        color: var(--water);
      }

      /* signature */
      #sig {
        background: var(--cream);
      }
      #sig-logo {
        position: absolute;
        left: 0;
        right: 0;
        top: 380px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 34px;
      }
      #sig-row {
        display: flex;
        align-items: center;
        gap: 30px;
      }
      #sig-row svg {
        width: 74px;
        height: 74px;
        color: var(--water);
      }
      .wordmark {
        font: 700 120px/1 "Fraunces", serif;
        letter-spacing: 0.18em;
        margin-right: -0.18em;
        color: var(--ink);
      }
      #sig-play {
        font: 600 52px/1 "Fraunces", serif;
        color: var(--water);
      }
      #sig-logos {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 80px;
        height: 56px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 48px;
      }
      #sig-logos img {
        height: 56px;
        width: auto;
        display: block;
      }

      /* drop + ripples (screen space) */
      #drop {
        position: absolute;
        left: 924px;
        top: 0;
        width: 72px;
        height: 96px;
      }
      #ripples {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #vignette {
        background: radial-gradient(
          ellipse 75% 75% at 50% 50%,
          rgba(58, 48, 36, 0) 55%,
          rgba(58, 48, 36, 0.3) 100%
        );
        pointer-events: none;
      }
      #grain {
        background-image: url("assets/grain.png");
        background-size: 256px 256px;
        opacity: 0.05;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <!-- Glyph library: 24x24 grid, 2px stroke, outline only (no emoji anywhere) -->
      <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <defs>
          <symbol id="g-drop" viewBox="0 0 24 24">
            <path d="M12 2.8C12 2.8 5.2 10.6 5.2 15.2a6.8 6.8 0 0 0 13.6 0C18.8 10.6 12 2.8 12 2.8Z" />
            <path d="M8.9 15.6a3.2 3.2 0 0 0 3.1 3" />
          </symbol>
          <symbol id="g-cattle" viewBox="0 0 24 24">
            <path d="M4.5 4.5C4.5 7 6 8.6 8.6 8.6" />
            <path d="M19.5 4.5C19.5 7 18 8.6 15.4 8.6" />
            <path
              d="M8.6 8.6h6.8c1.1 0 1.8.8 1.8 1.9v3.3c0 1.6-.8 2.6-1.6 3.4l-.6 2.6c-.3 1-1 1.5-2 1.5h-2c-1 0-1.7-.5-2-1.5l-.6-2.6c-.8-.8-1.6-1.8-1.6-3.4v-3.3c0-1.1.7-1.9 1.8-1.9Z"
            />
            <path d="M6.8 10.4 3.2 9.6l2.4 3" />
            <path d="M17.2 10.4l3.6-.8-2.4 3" />
            <path d="M10.4 18.4h.01M13.6 18.4h.01M10 12.6h.01M14 12.6h.01" />
          </symbol>
          <symbol id="g-grape" viewBox="0 0 24 24">
            <path d="M12 8.4V4.6" />
            <path d="M12 5.6c1.8-2.6 5.6-3 8-1-1.8 2.4-5.4 3-8 1Z" />
            <circle cx="9.8" cy="10.6" r="2.2" />
            <circle cx="14.2" cy="10.6" r="2.2" />
            <circle cx="9.8" cy="14.9" r="2.2" />
            <circle cx="14.2" cy="14.9" r="2.2" />
            <circle cx="12" cy="19.2" r="2.2" />
          </symbol>
          <symbol id="g-corn" viewBox="0 0 24 24">
            <path d="M12 2.8c2.6 2 2.6 10 0 14.2-2.6-4.2-2.6-12.2 0-14.2Z" />
            <path d="M10.7 7.6h2.6M10.5 10.6h3M10.8 13.6h2.4" />
            <path d="M12 17v4.2" />
            <path d="M12 19.4c-3-.8-6-3.8-6.8-8.2 2.4 1.8 4.4 3.8 5.8 6" />
            <path d="M12 19.4c3-.8 6-3.8 6.8-8.2-2.4 1.8-4.4 3.8-5.8 6" />
          </symbol>
          <symbol id="g-duck" viewBox="0 0 24 24">
            <circle cx="14.6" cy="7.8" r="3" />
            <path d="M17.5 7.2l3.8.9-3.6 1.3" />
            <path
              d="M12.4 10.2c-1.4 1.9-2.6 2.8-5.4 2.8-1.6 0-3-.4-3.8-1 0 4.6 3.6 8 8.8 8 4.4 0 7.6-2.4 7.6-6 0-1.5-.8-2.8-2.2-3.4"
            />
            <path d="M8 15.4c2 1.5 5 1.5 7 0" />
            <path d="M15 7.4h.01" />
          </symbol>
          <symbol id="g-town" viewBox="0 0 24 24">
            <path d="M12 1.6v1.4" />
            <path d="M12 3 16.8 10H7.2Z" />
            <path d="M8 10v11.2h8V10" />
            <path d="M10.6 21.2v-2.6a1.4 1.4 0 0 1 2.8 0v2.6" />
            <circle cx="12" cy="13.8" r="2" />
            <path d="M12 13.8v-1.1M12 13.8h.9" />
          </symbol>
          <symbol id="g-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4.4" />
            <path
              d="M12 2.2v2.6M12 19.2v2.6M2.2 12h2.6M19.2 12h2.6M5.1 5.1l1.8 1.8M17.1 17.1l1.8 1.8M5.1 18.9l1.8-1.8M17.1 6.9l1.8-1.8"
            />
          </symbol>
          <filter id="heat" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence type="fractalNoise" baseFrequency="0.003 0.022" numOctaves="2" seed="4" result="n" />
            <feOffset id="heat-offset" in="n" dx="0" dy="0" result="no" />
            <feDisplacementMap
              id="heat-map"
              in="SourceGraphic"
              in2="no"
              scale="0"
              xChannelSelector="R"
              yChannelSelector="G"
            />
          </filter>
        </defs>
      </svg>

      <div id="stage" class="clip layer" data-start="0" data-duration="30" data-track-index="0">
        <!-- ===================== WORLD ===================== -->
        <div id="world" class="layer">
          <div id="cam">
            <div id="board">
              <img id="board-img" src="public/board.webp" alt="" />
              <div id="grade-multiply"></div>
              <div id="grade-color"></div>
              <svg class="board-svg" viewBox="0 0 1672 941" preserveAspectRatio="none">
                <defs>
                  <path
                    id="river"
                    d="M 560,-10 C 573,-2 617,24 640,40 C 663,56 680,71 700,85 C 720,99 742,110 760,122 C 778,134 787,149 805,160 C 823,171 848,181 870,190 C 892,199 922,207 935,215 C 948,223 954,231 948,240 C 942,249 921,260 900,268 C 879,276 847,284 820,290 C 793,296 763,296 740,302 C 717,308 696,316 682,325 C 668,334 655,346 655,357 C 655,368 668,380 680,392 C 692,404 712,415 730,427 C 748,439 771,452 790,465 C 809,478 826,490 842,502 C 858,514 878,528 888,538 C 898,548 897,552 900,560 C 903,568 898,579 905,588 C 912,597 930,603 945,612 C 960,621 978,629 992,642 C 1006,655 1024,675 1028,690 C 1032,705 1025,718 1018,732 C 1011,746 996,757 988,772 C 980,787 970,805 972,820 C 974,835 986,848 1000,862 C 1014,876 1039,887 1058,902 C 1077,917 1103,943 1112,951"
                  />
                  <filter id="soft6" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="6" />
                  </filter>
                  <filter id="soft3" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" />
                  </filter>
                </defs>
                <!-- "la même eau pour tous": one shimmer down the river -->
                <g id="shimmer" opacity="0.32">
                  <use href="#river" class="shimmer-stroke" fill="none" stroke="#5BB5E8" stroke-width="30" stroke-linecap="round" filter="url(#soft6)" />
                  <use href="#river" class="shimmer-stroke" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" filter="url(#soft3)" />
                </g>
                <!-- drought: the river bed dries from downstream up -->
                <use id="drybed" href="#river" fill="none" stroke="#CDBFA4" stroke-width="58" stroke-linecap="round" opacity="0" filter="url(#soft6)" />
              </svg>
              <!-- drought cracks, drawn procedurally (seeded) -->
              <svg id="cracks" class="board-svg" viewBox="0 0 1920 1080"></svg>
            </div>

            <!-- dilemma threads + role medallions (camera space) -->
            <svg id="threads" class="board-svg" viewBox="0 0 1920 1080" style="overflow: visible"></svg>
            <div class="medal" id="m1" style="left: 17%; top: 16.5%; color: #b5705c">
              <div class="medal-disc center"><svg class="glyph"><use href="#g-cattle" /></svg></div>
            </div>
            <div class="medal" id="m2" style="left: 77%; top: 14%; color: #7b4b6b">
              <div class="medal-disc center"><svg class="glyph"><use href="#g-grape" /></svg></div>
            </div>
            <div class="medal" id="m3" style="left: 70%; top: 29%; color: #c77b6b">
              <div class="medal-disc center"><svg class="glyph"><use href="#g-town" /></svg></div>
            </div>
            <div class="medal" id="m4" style="left: 21%; top: 46%; color: #e0a82e">
              <div class="medal-disc center"><svg class="glyph"><use href="#g-corn" /></svg></div>
            </div>
            <div class="medal" id="m5" style="left: 84%; top: 75%; color: #d98a3d">
              <div class="medal-disc center"><svg class="glyph"><use href="#g-duck" /></svg></div>
            </div>
          </div>

          <div id="darken" class="layer"></div>
          <div id="sun-glow" class="layer"></div>
          <svg id="sun" class="glyph" style="stroke-width: 1.2"><use href="#g-sun" /></svg>

          <!-- living world: four punch-ins -->
          <div class="punch" id="pn1" style="color: #7b4b6b">
            <div class="punch-disc center"><svg class="glyph"><use href="#g-grape" /></svg></div>
            <div class="punch-word"><span>Des vignes</span></div>
          </div>
          <div class="punch" id="pn2" style="color: #b5705c">
            <div class="punch-disc center"><svg class="glyph"><use href="#g-cattle" /></svg></div>
            <div class="punch-word"><span>Des troupeaux</span></div>
          </div>
          <div class="punch" id="pn3" style="color: #c77b6b">
            <div class="punch-disc center"><svg class="glyph"><use href="#g-town" /></svg></div>
            <div class="punch-word"><span>Un village</span></div>
          </div>
          <div class="punch" id="pn4" style="color: #e0a82e">
            <div class="punch-disc center"><svg class="glyph"><use href="#g-corn" /></svg></div>
            <div class="punch-word"><span>Des champs</span></div>
          </div>

          <!-- drought words -->
          <div class="big-word" id="w1" style="top: 360px">MOINS DE PLUIE.</div>
          <div class="big-word" id="w2" style="top: 560px">PLUS DE BESOINS.</div>

          <!-- dilemma questions -->
          <div class="question" id="q1"><span>Partager ?</span></div>
          <div class="question" id="q2"><span>Garder ?</span></div>
          <div class="question" id="q3"><span>S’entendre ?</span></div>
        </div>

        <!-- ===================== THE QUESTION ===================== -->
        <div id="ask" class="layer center">
          <div id="ask-inner">
            <div class="ask-line" id="ask1">Saurez-vous tenir le territoire…</div>
            <div class="ask-line" id="ask2">quand <em>l’eau</em> vient à manquer ?</div>
          </div>
        </div>

        <!-- ===================== SIGNATURE ===================== -->
        <div id="sig" class="layer">
          <div id="sig-logo">
            <div id="sig-row">
              <svg class="glyph"><use href="#g-drop" /></svg>
              <div class="wordmark">SOLLAGUA</div>
            </div>
            <div id="sig-play">À vous de jouer.</div>
          </div>
          <div id="sig-logos">
            <img src="public/logos/interreg.png" alt="Interreg Sudoe" />
            <img src="public/logos/univ-toulouse.png" alt="Université de Toulouse" />
            <img src="public/logos/imt-mines-ales.png" alt="IMT Mines Alès" />
            <img src="public/logos/geode.png" alt="GEODE" />
            <img src="public/logos/defis-cles.png" alt="Défis clés Water Occitanie" />
          </div>
        </div>

        <!-- ===================== DROP + RIPPLES ===================== -->
        <svg id="ripples" viewBox="0 0 1920 1080">
          <circle class="ring" id="ring1" cx="960" cy="540" r="0" fill="none" stroke="#2C7FB8" stroke-width="3" />
          <circle class="ring" id="ring2" cx="960" cy="540" r="0" fill="none" stroke="#2C7FB8" stroke-width="2" />
          <circle class="ring" id="ring3" cx="960" cy="540" r="0" fill="none" stroke="#5BB5E8" stroke-width="2" />
        </svg>
        <svg id="drop" viewBox="0 0 24 32">
          <path
            d="M12 1C12 1 2.5 13.5 2.5 20.5a9.5 9.5 0 0 0 19 0C21.5 13.5 12 1 12 1Z"
            fill="#5BB5E8"
            stroke="#2C7FB8"
            stroke-width="1.4"
          />
          <path d="M7.4 21a4.6 4.6 0 0 0 4.6 4.6" fill="none" stroke="#FBF4E2" stroke-width="1.4" stroke-linecap="round" />
        </svg>

        <div id="vignette" class="layer"></div>
        <div id="grain" class="layer"></div>
      </div>

      <!-- ===================== SOUND ===================== -->
      <audio id="vo1" src="assets/voice/l1.mp3" data-start="1.6" data-duration="0.93" data-track-index="1" data-volume="1"></audio>
      <audio id="vo2" src="assets/voice/l2.mp3" data-start="3.4" data-duration="6.78" data-track-index="1" data-volume="1"></audio>
      <audio id="vo3" src="assets/voice/l3.mp3" data-start="11.0" data-duration="3.53" data-track-index="1" data-volume="1"></audio>

    <script>
      (function () {
        const W = 1920;
        const H = 1080;
        const FPS = 30;

        // ---------- seeded PRNG (deterministic) ----------
        function rng(seed) {
          let a = seed >>> 0;
          return function () {
            a = (a + 0x6d2b79f5) >>> 0;
            let t = a;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        // ---------- cracks: branching random walks on the fields ----------
        const crackSvg = document.getElementById("cracks");
        const R = rng(42);
        const CLUSTERS = [
          [520, 270], [740, 250], [1460, 230], [1660, 230], [320, 470],
          [560, 600], [1460, 780], [1600, 690], [820, 790], [330, 900], [1300, 960], [1720, 520],
        ];
        let crackMarkup = "";
        function walk(x, y, ang, steps, width, depth) {
          let d = "M" + x.toFixed(1) + " " + y.toFixed(1);
          for (let i = 0; i < steps; i++) {
            ang += (R() - 0.5) * 0.9;
            const len = 9 + R() * 12;
            x += Math.cos(ang) * len;
            y += Math.sin(ang) * len;
            d += " L" + x.toFixed(1) + " " + y.toFixed(1);
            if (depth < 2 && R() < 0.22) walk(x, y, ang + (R() < 0.5 ? -1 : 1) * (0.7 + R() * 0.6), Math.floor(steps * 0.5), width * 0.6, depth + 1);
          }
          crackMarkup +=
            '<path class="crack" d="' + d + '" fill="none" stroke="#3A3024" stroke-opacity="0.78" stroke-width="' +
            width.toFixed(2) + '" stroke-linecap="round" stroke-linejoin="round"/>';
        }
        CLUSTERS.forEach(([cx, cy]) => {
          const n = 3 + Math.floor(R() * 2);
          for (let k = 0; k < n; k++) walk(cx, cy, (k / n) * Math.PI * 2 + R() * 0.8, 8 + Math.floor(R() * 5), 3.6, 0);
        });
        crackSvg.innerHTML = crackMarkup;
        const cracks = Array.from(crackSvg.querySelectorAll(".crack"));
        cracks.forEach((p) => {
          const L = p.getTotalLength();
          p.setAttribute("stroke-dasharray", L.toFixed(1) + " " + (L + 10).toFixed(1));
          p.setAttribute("stroke-dashoffset", L.toFixed(1));
        });

        // ---------- dilemma threads ----------
        const THREADS = [
          { from: [0.17, 0.165], to: [0.42, 0.09], color: "#B5705C" },
          { from: [0.77, 0.14], to: [0.56, 0.23], color: "#7B4B6B" },
          { from: [0.7, 0.29], to: [0.54, 0.285], color: "#C77B6B" },
          { from: [0.21, 0.46], to: [0.44, 0.45], color: "#E0A82E" },
          { from: [0.84, 0.75], to: [0.61, 0.78], color: "#D98A3D" },
        ];
        const threadSvg = document.getElementById("threads");
        threadSvg.innerHTML = THREADS.map(
          (t, i) =>
            '<path id="th' + i + '" fill="none" stroke="' + t.color +
            '" stroke-width="7" stroke-linecap="round" opacity="0"/>' +
            '<circle id="tk' + i + '" cx="' + (t.to[0] * W).toFixed(1) + '" cy="' + (t.to[1] * H).toFixed(1) +
            '" r="10" fill="' + t.color + '" opacity="0"/>',
        ).join("");
        const tension = { sag: 90, wobble: 0 };
        function applyThreads() {
          THREADS.forEach((t, i) => {
            const x1 = t.from[0] * W, y1 = t.from[1] * H, x2 = t.to[0] * W, y2 = t.to[1] * H;
            const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
            const s = tension.sag + tension.wobble * (i % 2 ? 1 : -1);
            document.getElementById("th" + i).setAttribute(
              "d",
              "M" + x1.toFixed(1) + " " + y1.toFixed(1) + " Q" + mx.toFixed(1) + " " + (my + s).toFixed(1) +
                " " + x2.toFixed(1) + " " + y2.toFixed(1),
            );
          });
        }
        applyThreads();

        // ---------- camera: focus point (fx, fy) held at screen centre, clamped to the board ----------
        const cam = { s: 1.3, fx: 0.5, fy: 0.5, pulse: 0 };
        const camEl = document.getElementById("cam");
        function applyCam() {
          const s = cam.s * (1 + cam.pulse);
          let tx = W / 2 - s * cam.fx * W;
          let ty = H / 2 - s * cam.fy * H;
          tx = Math.min(0, Math.max(W - s * W, tx));
          ty = Math.min(0, Math.max(H - s * H, ty));
          camEl.style.transform = "translate(" + tx.toFixed(2) + "px," + ty.toFixed(2) + "px) scale(" + s.toFixed(5) + ")";
        }
        applyCam();

        // ---------- grain ----------
        const grainEl = document.getElementById("grain");
        function applyGrain(t) {
          const f = Math.floor(t * FPS + 1e-6);
          const h = Math.imul(f + 1, 2654435761) >>> 0;
          grainEl.style.backgroundPosition = (h % 256) + "px " + ((h >>> 8) % 256) + "px";
        }

        const tl = gsap.timeline({
          paused: true,
          onUpdate: function () {
            applyGrain(this.time());
          },
        });
        applyGrain(0);

        // ============ 1 · LA GOUTTE · 0.0 → 3.2 ============
        tl.fromTo("#world", { clipPath: "circle(0px at 960px 540px)" }, { clipPath: "circle(1150px at 960px 540px)", duration: 2.2, ease: "power2.out" }, 1.2);
        tl.fromTo("#drop", { y: -120, scaleY: 1, opacity: 1 }, { y: 470, scaleY: 1.18, duration: 0.85, ease: "power2.in" }, 0.35);
        tl.to("#drop", { scale: 0, opacity: 0, duration: 0.12, ease: "power1.in" }, 1.2);
        ["#ring1", "#ring2", "#ring3"].forEach((id, i) => {
          tl.fromTo(id, { attr: { r: 0 }, opacity: 0.9 }, { attr: { r: 700 + i * 260 }, opacity: 0, duration: 1.8, ease: "power2.out" }, 1.2 + i * 0.18);
        });
        tl.to(cam, { s: 1.18, duration: 2.2, ease: "power1.out", onUpdate: applyCam }, 1.2);

        // ============ 2 · LE MONDE VIVANT · 3.4 → 10.6 ============
        const PUNCH = [
          { t: 3.45, id: "#pn1", fx: 0.74, fy: 0.11 },
          { t: 4.58, id: "#pn2", fx: 0.15, fy: 0.24 },
          { t: 5.84, id: "#pn3", fx: 0.7, fy: 0.28 },
          { t: 7.12, id: "#pn4", fx: 0.24, fy: 0.47 },
        ];
        PUNCH.forEach((p, i) => {
          tl.to(cam, { s: 2.3, fx: p.fx, fy: p.fy, duration: 0.38, ease: "power3.inOut", onUpdate: applyCam }, p.t);
          const end = i < PUNCH.length - 1 ? PUNCH[i + 1].t : 8.0;
          tl.to(cam, { s: 2.42, duration: end - p.t - 0.38, ease: "none", onUpdate: applyCam }, p.t + 0.38);
          tl.fromTo(p.id + " .punch-disc", { scale: 0.4, opacity: 0 }, { scale: 1.08, opacity: 1, duration: 0.22, ease: "power2.out" }, p.t + 0.28);
          tl.to(p.id + " .punch-disc", { scale: 1, duration: 0.14, ease: "sine.inOut" }, p.t + 0.5);
          tl.fromTo(p.id + " .punch-word", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, p.t + 0.36);
          tl.to(p.id, { opacity: 0, scale: 0.85, duration: 0.18, ease: "power1.in" }, end - 0.05);
        });
        // "La même eau pour tous": pull back over the whole territory, the river shines
        tl.to(cam, { s: 1.1, fx: 0.52, fy: 0.5, duration: 0.9, ease: "power2.inOut", onUpdate: applyCam }, 8.0);
        const riverPath = document.getElementById("river");
        const RL = riverPath.getTotalLength();
        tl.fromTo(
          ".shimmer-stroke",
          { attr: { "stroke-dasharray": "220 " + (RL + 440), "stroke-dashoffset": 220 } },
          { attr: { "stroke-dashoffset": -RL }, duration: 2.2, ease: "power1.inOut" },
          8.3,
        );

        // ============ 3 · LA SÉCHERESSE · 10.6 → 17.0 ============
        tl.to(cam, { s: 1.24, fx: 0.55, fy: 0.5, duration: 6.35, ease: "sine.inOut", onUpdate: applyCam }, 10.6);
        tl.fromTo("#sun", { y: 320, opacity: 0, rotation: 0 }, { y: 70, opacity: 1, rotation: 40, duration: 4.5, ease: "power2.out" }, 10.6);
        tl.fromTo("#sun-glow", { opacity: 0 }, { opacity: 1, duration: 4, ease: "sine.inOut" }, 10.6);
        tl.fromTo("#grade-multiply", { opacity: 0 }, { opacity: 0.42, duration: 4.5, ease: "sine.inOut" }, 10.8);
        tl.fromTo("#grade-color", { opacity: 0 }, { opacity: 0.16, duration: 4.5, ease: "sine.inOut" }, 10.8);
        tl.fromTo("#board-img", { filter: "saturate(1)" }, { filter: "saturate(0.62)", duration: 4.5, ease: "sine.inOut" }, 10.8);
        tl.set("#board", { filter: "url(#heat)" }, 11.2);
        tl.fromTo("#heat-map", { attr: { scale: 0 } }, { attr: { scale: 9 }, duration: 2.5, ease: "sine.inOut" }, 11.2);
        tl.fromTo("#heat-offset", { attr: { dy: 0 } }, { attr: { dy: -240 }, duration: 11.7, ease: "none" }, 11.2);
        tl.fromTo("#drybed", { opacity: 0 }, { opacity: 0.85, duration: 0.8, ease: "none" }, 11.4);
        tl.fromTo(
          "#drybed",
          { attr: { "stroke-dasharray": RL + " " + (RL + 300), "stroke-dashoffset": -RL } },
          { attr: { "stroke-dashoffset": 0 }, duration: 4.4, ease: "sine.inOut", immediateRender: false },
          11.4,
        );
        cracks.forEach((p, i) => {
          const t0 = 12.4 + (i % 12) * 0.22 + (i % 5) * 0.07;
          tl.to(p, { attr: { "stroke-dashoffset": 0 }, duration: 1.4, ease: "power1.out" }, t0);
        });
        tl.fromTo("#darken", { opacity: 0 }, { opacity: 0.32, duration: 0.6, ease: "sine.inOut" }, 12.3);
        tl.fromTo("#w1", { opacity: 0, scale: 1.18 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 12.75);
        tl.fromTo("#w2", { opacity: 0, scale: 1.18 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 14.65);
        tl.to(["#w1", "#w2"], { opacity: 0, duration: 0.3, ease: "power1.in" }, 16.6);
        tl.to("#darken", { opacity: 0.14, duration: 0.6, ease: "sine.inOut" }, 16.7);

        // ============ 4 · LE DILEMME · 17.0 → 22.9 ============
        tl.to(cam, { s: 1.1, fx: 0.5, fy: 0.5, duration: 0.55, ease: "power3.inOut", onUpdate: applyCam }, 16.95);
        tl.to("#heat-map", { attr: { scale: 4 }, duration: 0.6, ease: "sine.inOut" }, 16.95);
        tl.to("#sun", { opacity: 0.55, duration: 0.6, ease: "none" }, 16.95);
        ["#m1", "#m2", "#m3", "#m4", "#m5"].forEach((id, i) => {
          tl.fromTo(id + " .medal-disc", { scale: 0.4, opacity: 0 }, { scale: 1.06, opacity: 1, duration: 0.25, ease: "power2.out" }, 17.25 + i * 0.07);
          tl.to(id + " .medal-disc", { scale: 1, duration: 0.12, ease: "sine.inOut" }, 17.5 + i * 0.07);
          tl.fromTo("#th" + i, { opacity: 0 }, { opacity: 0.95, duration: 0.3, ease: "none" }, 17.35 + i * 0.07);
          tl.fromTo("#tk" + i, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 17.35 + i * 0.07);
        });
        const Q = [
          { id: "#q1", t: 17.4, sag: 60 },
          { id: "#q2", t: 18.18, sag: 34 },
          { id: "#q3", t: 18.99, sag: 16 },
        ];
        Q.forEach((q, i) => {
          tl.fromTo(q.id, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, q.t);
          tl.to(q.id, { opacity: 0, duration: 0.15, ease: "power1.in" }, i < Q.length - 1 ? Q[i + 1].t - 0.05 : 20.7);
          tl.to(tension, { sag: q.sag, duration: 0.35, ease: "power2.out", onUpdate: applyThreads }, q.t);
          tl.fromTo(cam, { pulse: 0 }, { pulse: 0.018, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, onUpdate: applyCam, immediateRender: false }, q.t);
        });
        // the threads pull taut, the frame tightens like a heartbeat, then a hard cut to silence
        tl.to(tension, { sag: 0, duration: 1.6, ease: "power2.in", onUpdate: applyThreads }, 20.8);
        tl.fromTo(tension, { wobble: 0 }, { wobble: 3, duration: 0.09, ease: "sine.inOut", yoyo: true, repeat: 11, onUpdate: applyThreads, immediateRender: false }, 21.8);
        [21.2, 21.85, 22.4].forEach((t) => {
          tl.fromTo(cam, { pulse: 0 }, { pulse: 0.025, duration: 0.11, ease: "power2.out", yoyo: true, repeat: 1, onUpdate: applyCam, immediateRender: false }, t);
        });
        tl.to(cam, { s: 1.16, duration: 1.9, ease: "power1.in", onUpdate: applyCam }, 20.9);
        tl.to("#darken", { opacity: 0.3, duration: 1.9, ease: "power1.in" }, 20.9);

        // ============ 5 · LA QUESTION · 22.9 → 27.6 ============
        tl.fromTo("#ask", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 22.9);
        tl.fromTo("#ask1", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 23.6);
        tl.fromTo("#ask2", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 25.8);
        tl.fromTo("#ask-inner", { scale: 1 }, { scale: 1.04, duration: 4.1, ease: "none" }, 23.5);
        tl.to("#ask-inner", { opacity: 0, duration: 0.3, ease: "power1.in" }, 27.45);

        // ============ 6 · SIGNATURE · 27.6 → 30.0 ============
        tl.fromTo("#sig", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 27.6);
        tl.fromTo("#drop", { y: -120, scale: 0.8, scaleY: 1, opacity: 1 }, { y: 330, scaleY: 1.15, duration: 0.42, ease: "power2.in", immediateRender: false }, 27.6);
        tl.to("#drop", { opacity: 0, scale: 0.4, duration: 0.1, ease: "power1.in" }, 28.02);
        ["#ring1", "#ring2"].forEach((id, i) => {
          tl.fromTo(id, { attr: { r: 0, cy: 420 }, opacity: 0.7 }, { attr: { r: 520 + i * 200 }, opacity: 0, duration: 1.3, ease: "power2.out", immediateRender: false }, 28.02 + i * 0.14);
        });
        tl.fromTo("#sig-row", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 28.05);
        tl.fromTo("#sig-play", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 28.45);
        tl.fromTo("#sig-logos", { opacity: 0 }, { opacity: 0.92, duration: 0.45, ease: "none" }, 28.8);

        tl.set({}, {}, 30);
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Fraunces";
        font-weight: 600;
        font-display: block;
        src: url("assets/fonts/Fraunces-wght-600-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Fraunces";
        font-weight: 700;
        font-display: block;
        src: url("assets/fonts/Fraunces-wght-700-latin.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b2a3a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b2a3a;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #gl {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #vignette {
        background: radial-gradient(ellipse 72% 72% at 50% 50%, rgba(20, 14, 8, 0) 55%, rgba(20, 14, 8, 0.42) 100%);
      }
      #veil {
        background: radial-gradient(ellipse 62% 58% at 50% 47%, rgba(6, 30, 44, 0.62) 0%, rgba(6, 30, 44, 0.36) 55%, rgba(6, 30, 44, 0.1) 100%);
        opacity: 0;
      }
      #grain {
        background-image: url("assets/grain.png");
        background-size: 256px 256px;
        opacity: 0.045;
      }
      #final {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        padding-bottom: 90px;
        opacity: 0;
      }
      #logo {
        display: flex;
        align-items: center;
        gap: 30px;
        color: #fbf4e2;
      }
      #logo svg {
        width: 80px;
        height: 80px;
        fill: none;
        stroke: #9fd4f5;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #wordmark {
        font: 700 112px/1 "Fraunces", serif;
        letter-spacing: 0.14em;
        margin-right: -0.14em;
        text-shadow: 0 6px 30px rgba(0, 20, 30, 0.55);
      }
      .ask {
        font: 600 56px/1.15 "Fraunces", serif;
        color: #fbf4e2;
        text-align: center;
        text-shadow: 0 4px 22px rgba(0, 20, 30, 0.6);
        white-space: nowrap;
      }
      .ask em {
        font-style: normal;
        color: #9fd4f5;
      }
      #play {
        font: 600 40px/1 "Fraunces", serif;
        color: #9fd4f5;
        margin-top: 6px;
        text-shadow: 0 4px 18px rgba(0, 20, 30, 0.6);
      }
      #partners {
        position: absolute;
        left: 50%;
        bottom: 62px;
        display: flex;
        align-items: center;
        gap: 44px;
        padding: 14px 36px;
        border-radius: 18px;
        background: rgba(251, 244, 226, 0.94);
        box-shadow: 0 10px 36px rgba(0, 15, 25, 0.35);
        opacity: 0;
      }
      #partners img {
        height: 50px;
        width: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="36"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage" class="clip" data-start="0" data-duration="36" data-track-index="0">
        <canvas id="gl" width="1920" height="1080"></canvas>
        <div id="vignette" class="layer"></div>
        <div id="veil" class="layer"></div>
        <div id="final" class="layer">
          <div id="logo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2.8C12 2.8 5.2 10.6 5.2 15.2a6.8 6.8 0 0 0 13.6 0C18.8 10.6 12 2.8 12 2.8Z" />
              <path d="M8.9 15.6a3.2 3.2 0 0 0 3.1 3" />
            </svg>
            <div id="wordmark">SCÉNAR’EAU</div>
          </div>
          <div class="ask" id="ask1">Saurez-vous tenir le territoire…</div>
          <div class="ask" id="ask2">quand <em>l’eau</em> vient à manquer ?</div>
          <div id="play">À vous de jouer.</div>
        </div>
        <div id="partners">
          <img src="assets/logos/interreg.png" alt="Interreg Sudoe" />
          <img src="assets/logos/univ-toulouse.png" alt="Université de Toulouse" />
          <img src="assets/logos/imt-mines-ales.png" alt="IMT Mines Alès" />
          <img src="assets/logos/geode.png" alt="GEODE" />
          <img src="assets/logos/defis-cles.png" alt="Défis clés Water Occitanie" />
        </div>
        <div id="grain" class="layer"></div>
      </div>

      <audio id="vo1" src="assets/l1.mp3" data-start="3.7" data-duration="1.2" data-track-index="1" data-volume="1"></audio>
      <audio id="vo2" src="assets/l2.mp3" data-start="4.9" data-duration="7.0" data-track-index="1" data-volume="1"></audio>
      <audio id="vo3" src="assets/l3.mp3" data-start="13.4" data-duration="3.8" data-track-index="1" data-volume="1"></audio>
      <audio id="vo4" src="assets/l4.mp3" data-start="19.6" data-duration="4.7" data-track-index="1" data-volume="1"></audio>
      <audio id="vo5" src="assets/l5.mp3" data-start="28.0" data-duration="4.2" data-track-index="1" data-volume="1"></audio>
      <audio id="music" src="assets/music.mp3" data-start="0" data-duration="36" data-track-index="2" data-volume="1"></audio>
      <audio id="sfx-drop" src="assets/sfx-drop.mp3" data-start="3.45" data-duration="2" data-track-index="3" data-volume="1"></audio>
      <audio id="sfx-stream" src="assets/sfx-stream.mp3" data-start="3.6" data-duration="8" data-track-index="4" data-volume="1"></audio>
      <audio id="sfx-wind" src="assets/sfx-wind.mp3" data-start="13.2" data-duration="5" data-track-index="3" data-volume="1"></audio>
      <audio id="sfx-crack" src="assets/sfx-crack.mp3" data-start="15.4" data-duration="3" data-track-index="4" data-volume="1"></audio>
      <audio id="sfx-rain" src="assets/sfx-rain.mp3" data-start="23.9" data-duration="5.6" data-track-index="5" data-volume="1"></audio>
      <audio id="sfx-ripple" src="assets/sfx-ripple.mp3" data-start="27.15" data-duration="4" data-track-index="3" data-volume="1"></audio>
      <audio id="sfx-chime" src="assets/sfx-chime.mp3" data-start="27.9" data-duration="2.5" data-track-index="4" data-volume="1"></audio>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
      import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
      import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      const W = 1920;
      const H = 1080;
      const FPS = 30;
      const DURATION = 36;

      // ---------------- helpers ----------------
      const clamp01 = (v) => Math.min(1, Math.max(0, v));
      const smooth = (v) => {
        const x = clamp01(v);
        return x * x * (3 - 2 * x);
      };
      const sineInOut = (v) => 0.5 - 0.5 * Math.cos(Math.PI * clamp01(v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const win = (t, a, b) => smooth((t - a) / (b - a));
      function rng(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const hash2 = (x, z) => {
        const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
        return s - Math.floor(s);
      };
      function noise2(x, z) {
        const ix = Math.floor(x);
        const iz = Math.floor(z);
        let fx = x - ix;
        let fz = z - iz;
        fx = fx * fx * (3 - 2 * fx);
        fz = fz * fz * (3 - 2 * fz);
        return lerp(lerp(hash2(ix, iz), hash2(ix + 1, iz), fx), lerp(hash2(ix, iz + 1), hash2(ix + 1, iz + 1), fx), fz);
      }
      const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

      // ---------------- the valley, laid out like the game board ----------------
      const BW = 40;
      const BD = 22.5;
      const board = (bx, by) => new THREE.Vector2((bx - 0.5) * BW, (by - 0.5) * BD);
      const RIVER_PX = [
        [560, -10], [640, 40], [700, 85], [760, 122], [805, 160], [870, 190], [935, 215], [948, 240], [900, 268],
        [820, 290], [740, 302], [682, 325], [655, 357], [680, 392], [730, 427], [790, 465], [842, 502], [888, 538],
        [900, 560], [905, 588], [945, 612], [992, 642], [1028, 690], [1018, 732], [988, 772], [972, 820], [1000, 862],
        [1058, 902], [1112, 951],
      ];
      const river2d = new THREE.SplineCurve(RIVER_PX.map(([x, y]) => board(x / 1672, y / 941)));
      const RIVER_N = 700;
      const riverSamples = river2d.getSpacedPoints(RIVER_N);
      const riverLen = river2d.getLength();
      const RIVER_HALF = 0.85;

      const PLACES = {
        troupeaux: { p: board(0.16, 0.175), r: 3.0 },
        vigne: { p: board(0.77, 0.13), r: 3.2 },
        village: { p: board(0.7, 0.3), r: 2.8 },
        champs: { p: board(0.21, 0.46), r: 3.6 },
        volaille: { p: board(0.66, 0.84), r: 2.2 },
        village2: { p: board(0.2, 0.7), r: 2.6 },
      };
      // each place wakes on its word in the voice-over (absolute seconds)
      const WORD_T = { vigne: 5.19, troupeaux: 6.33, village: 7.59, champs: 8.87, volaille: 10.4, village2: 9.9 };
      const ROLES = ["troupeaux", "vigne", "village", "champs", "volaille"];

      function riverNear(x, z) {
        let best = 1e9;
        let bi = 0;
        for (let i = 0; i < riverSamples.length; i++) {
          const d = (riverSamples[i].x - x) ** 2 + (riverSamples[i].y - z) ** 2;
          if (d < best) {
            best = d;
            bi = i;
          }
        }
        return { d: Math.sqrt(best), u: bi / RIVER_N };
      }
      function baseHeight(x, z) {
        let h =
          0.55 * Math.sin(x * 0.21 + 1.3) * Math.cos(z * 0.27) +
          0.32 * Math.sin(x * 0.53 + z * 0.31) +
          0.18 * Math.sin(z * 0.9 + x * 0.17);
        const ex = Math.abs(x) / 21;
        const ez = Math.abs(z) / 12;
        h += 2.6 * smooth((Math.max(ex, ez) - 0.78) / 0.5);
        return h;
      }
      const placeBase = {};
      for (const k in PLACES) placeBase[k] = baseHeight(PLACES[k].p.x, PLACES[k].p.y);
      function heightD(x, z, d) {
        let h = baseHeight(x, z) * (0.35 + 0.65 * smooth(d / 3.5));
        for (const k in PLACES) {
          const pl = PLACES[k];
          const dp = Math.hypot(x - pl.p.x, z - pl.p.y);
          h = lerp(h, placeBase[k] * 0.7, smooth((pl.r + 2.0 - dp) / 2.0));
        }
        h -= 1.0 * Math.exp(-((d / 1.25) ** 2));
        return h;
      }
      const height = (x, z) => heightD(x, z, riverNear(x, z).d);

      // ---------------- timeline ----------------
      const T = {
        dropStart: 0.3, impact: 3.5,
        wide0: 11.0, wide1: 13.0,
        dry0: 13.4,
        dilemma: 19.6, frag0: 19.9, frag1: 23.6,
        storm0: 22.4, rain0: 23.9, slow0: 25.2, heroIn: 25.5, hit: 27.2,
        logo: 27.9, ask1: 28.0, ask2: 30.25, play: 32.6, partners: 33.2,
      };
      const HEAD_KEYS = [[3.5, 0.0], [5.1, 0.28], [8.8, 0.5], [11.3, 1.0]];
      function headU(t) {
        if (t <= HEAD_KEYS[0][0]) return 0;
        for (let i = 1; i < HEAD_KEYS.length; i++) {
          const [t0, u0] = HEAD_KEYS[i - 1];
          const [t1, u1] = HEAD_KEYS[i];
          if (t <= t1) return lerp(u0, u1, (t - t0) / (t1 - t0));
        }
        return 1;
      }
      function headTime(u) {
        for (let i = 1; i < HEAD_KEYS.length; i++) {
          const [t0, u0] = HEAD_KEYS[i - 1];
          const [t1, u1] = HEAD_KEYS[i];
          if (u <= u1) return lerp(t0, t1, (u - u0) / (u1 - u0));
        }
        return HEAD_KEYS[HEAD_KEYS.length - 1][0];
      }
      // when a point of the valley wakes up (water reaches it) and starts to dry
      function wakeAt(x, z, d, u) {
        let w = headTime(u) + 0.35 + d * 0.42 + (noise2(x * 0.6, z * 0.6) - 0.5) * 1.2;
        for (const k in PLACES) {
          const dp = Math.hypot(x - PLACES[k].p.x, z - PLACES[k].p.y);
          if (dp < PLACES[k].r + 2.5) w = Math.min(w, WORD_T[k] + 0.2 + dp * 0.22);
        }
        return Math.min(w, 11.0 + noise2(x * 0.9, z * 0.9) * 0.8);
      }
      function dryAt(x, z, d) {
        return T.dry0 + 0.2 + 4.0 * smooth(1 - d / 9) + (noise2(x * 0.45 + 9, z * 0.45) - 0.5) * 1.6;
      }

      // ---------------- renderer ----------------
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0xf2e6cc, 30, 80);
      const camera = new THREE.PerspectiveCamera(40, W / H, 0.02, 300);

      const NOISE = `
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y); }`;

      // shared clocks for every shader
      const G = {
        uTime: { value: 0 },
        uRing: { value: -10 },
        uRingAmp: { value: 0 },
        uImpact: { value: new THREE.Vector2() },
      };

      // sky: gradient + soft procedural clouds that thicken into a storm
      const skyU = {
        top: { value: new THREE.Color() },
        horizon: { value: new THREE.Color() },
        uStorm: { value: 0 },
        uTime: G.uTime,
      };
      const sky = new THREE.Mesh(
        new THREE.SphereGeometry(150, 48, 24),
        new THREE.ShaderMaterial({
          side: THREE.BackSide,
          depthWrite: false,
          fog: false,
          uniforms: skyU,
          vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
          fragmentShader:
            "uniform vec3 top; uniform vec3 horizon; uniform float uStorm; uniform float uTime; varying vec3 vP;" +
            NOISE +
            `
float fbm(vec2 p){ float a = 0.5; float s = 0.0; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + 11.7; a *= 0.5; } return s; }
void main(){
  float k = smoothstep(-0.05, 0.55, vP.y);
  vec3 col = mix(horizon, top, k);
  vec2 cp = vP.xz / (vP.y + 0.22) * 1.3 + vec2(uTime * 0.012, uTime * 0.004);
  float c = fbm(cp);
  float cov = mix(0.6, 0.3, uStorm);
  float cl = smoothstep(cov, cov + mix(0.22, 0.35, uStorm), c);
  vec3 lit = mix(vec3(1.0, 0.985, 0.96), vec3(0.36, 0.39, 0.45), uStorm);
  vec3 shade = mix(vec3(0.86, 0.88, 0.92), vec3(0.18, 0.2, 0.25), uStorm);
  vec3 cc = mix(lit, shade, smoothstep(0.55, 0.95, c));
  col = mix(col, cc, cl * smoothstep(-0.02, 0.18, vP.y) * 0.92);
  gl_FragColor = vec4(col, 1.0);
}`,
        }),
      );
      scene.add(sky);

      const sun = new THREE.DirectionalLight(0xfff1d8, 2.4);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -27;
      sun.shadow.camera.right = 27;
      sun.shadow.camera.top = 19;
      sun.shadow.camera.bottom = -19;
      sun.shadow.camera.near = 1;
      sun.shadow.camera.far = 100;
      sun.shadow.bias = -0.0005;
      sun.shadow.normalBias = 0.03;
      scene.add(sun, sun.target);
      const hemi = new THREE.HemisphereLight(0xcfe3f0, 0x6b5a3c, 0.8);
      scene.add(hemi);

      // ---------------- loading ----------------
      const jobs = [];
      const texLoader = new THREE.TextureLoader();
      const TEX = {};
      function tex(name) {
        jobs.push(
          new Promise((res) =>
            texLoader.load("assets/tex/" + name + ".jpg", (t) => {
              t.wrapS = t.wrapT = THREE.RepeatWrapping;
              t.colorSpace = THREE.SRGBColorSpace;
              t.anisotropy = 8;
              TEX[name] = t;
              res();
            }),
          ),
        );
      }
      [
        "forest_ground_05", "grass_ground", "withered_grass", "dry_ground_01", "mud_cracked_dry_03", "brown_mud_03",
        "dry_river_pebbles", "mud_cracked_dry_riverbed_002", "farm_furrows", "rocky_terrain", "yellow_stone_wall",
      ].forEach(tex);
      const pmrem = new THREE.PMREMGenerator(renderer);
      jobs.push(
        new Promise((res) =>
          new RGBELoader().load("assets/hdri/near_the_river_01.hdr", (t) => {
            t.mapping = THREE.EquirectangularReflectionMapping;
            scene.environment = pmrem.fromEquirectangular(t).texture;
            scene.environmentIntensity = 0.45;
            res();
          }),
        ),
      );
      const gltfLoader = new GLTFLoader();
      gltfLoader.setMeshoptDecoder(MeshoptDecoder);
      const MODELS = {};
      [
        "MapleTree_1", "MapleTree_2", "MapleTree_3", "BirchTree_1", "BirchTree_2", "Bush", "Bush_Large", "Bush_Small",
        "Grass_Large", "Flower_3_Clump", "Rock", "Rock_Group", "Houses_SecondAge_1_Level1", "Houses_SecondAge_1_Level2",
        "Houses_SecondAge_2_Level2", "Houses_SecondAge_3_Level1", "Houses_FirstAge_1_Level1", "Temple_SecondAge_Level1",
        "TowerHouse_SecondAge", "Windmill_SecondAge", "Storage_SecondAge_Level1", "Farm_SecondAge_Level1_Wheat",
        "Farm_SecondAge_Level2_Wheat", "Farm_SecondAge_Level3_Wheat", "Barrel", "Logs", "Crate_Stack1",
        "Cow", "Bull", "Horse", "Donkey",
      ].forEach((n) =>
        jobs.push(
          new Promise((res, rej) =>
            gltfLoader.load("assets/models/" + n + ".glb", (g) => {
              MODELS[n] = g;
              res();
            }, undefined, rej),
          ),
        ),
      );

      // ---------------- eco shader: every prop wakes, dries and regrows ----------------
      const KIND_VS = {
        leaf: `float s = mix(0.6, 1.0, vLife) * (1.0 - smoothstep(1.6, 2.7, vDryK));
transformed = uPivot + (transformed - uPivot) * max(s, 0.001);`,
        crop: `transformed.y *= 1.5 * mix(0.1, 1.0, vLife) * mix(1.0, 0.55, smoothstep(0.4, 2.0, vDryK));`,
        grass: `transformed *= max(0.001, mix(0.25, 1.0, vLife) * mix(1.0, 0.5, smoothstep(0.5, 2.5, vDryK)));`,
        build: ``,
        solid: ``,
      };
      KIND_VS.leafR = KIND_VS.leaf;
      // colours are written in sRGB and converted (L) because shading runs in linear light
      const LEAF_DRY = `c = mix(c, L(vec3(0.82, 0.68, 0.26)) * (0.5 + 3.0 * ecoL), smoothstep(0.0, 1.0, vDryK));
c = mix(c, L(vec3(0.62, 0.4, 0.2)) * (0.5 + 3.0 * ecoL), smoothstep(1.0, 1.9, vDryK));`;
      const KIND_FS = {
        leaf: `vec3 dorm = mix(vec3(ecoL), c, 0.25) * vec3(1.05, 0.95, 0.72);
c = mix(dorm, c * vec3(0.85, 1.08, 0.75), vLife);
${LEAF_DRY}`,
        leafR: `float lv = clamp(ecoL * 4.0, 0.0, 1.0);
vec3 g0 = mix(L(vec3(0.2, 0.33, 0.1)), L(vec3(0.3, 0.42, 0.12)), vVar);
vec3 g1 = mix(L(vec3(0.5, 0.66, 0.22)), L(vec3(0.6, 0.7, 0.26)), vVar);
c = mix(g0, g1, lv);

        skyU.top.value.copy(cA.setHex(a[1])).lerp(cB.setHex(b[1]), k);
        skyU.horizon.value.copy(cA.setHex(a[2])).lerp(cB.setHex(b[2]), k);
        scene.fog.color.copy(skyU.horizon.value);
        sun.color.copy(cA.setHex(a[3])).lerp(cB.setHex(b[3]), k);
        sun.intensity = lerp(a[4], b[4], k);
        hemi.intensity = lerp(a[5], b[5], k);
        scene.environmentIntensity = lerp(a[6], b[6], k);
        skyU.uStorm.value = lerp(a[7], b[7], k);
        const ang = lerp(0.95, 0.4, win(t, 12.5, 24));
        sun.position.set(Math.cos(ang) * 30 - 6, Math.sin(ang) * 30, 14);
        scene.fog.near = lerp(30, 14, win(t, 23.5, 25.5) * (1 - win(t, 27.6, 30)));
        scene.fog.far = lerp(80, 55, win(t, 23.5, 25.5) * (1 - win(t, 27.6, 30)));
      }

      // slow motion around the final drop: tau is the warped clock
      function tau(t) {
        const a = 25.2;
        const b = 25.9;
        const c = 27.45;
        const d = 28.1;
        const s = 0.12;
        if (t <= a) return t;
        let acc = a;
        const seg = (t0, t1, f) => {
          const N = 40;
          let sum = 0;
          for (let i = 0; i < N; i++) {
            const x = t0 + ((t1 - t0) * (i + 0.5)) / N;
            sum += f(x);
          }
          return (sum * (t1 - t0)) / N;
        };
        acc += seg(a, Math.min(t, b), (x) => lerp(1, s, sineInOut((x - a) / (b - a))));
        if (t > b) acc += (Math.min(t, c) - b) * s;
        if (t > c) acc += seg(c, Math.min(t, d), (x) => lerp(s, 1, sineInOut((x - c) / (d - c))));
        if (t > d) acc += t - d;
        return acc;
      }
      // the river slows as it dries: integrated flow clock
      function flowClock(t) {
        const N = 120;
        let sum = 0;
        for (let i = 0; i < N; i++) {
          const x = (t * (i + 0.5)) / N;
          sum += lerp(1, 0.25, win(x, T.dry0, 19.5));
        }
        return (sum * t) / N;
      }

      const ringR = (t) => {
        const k = t - T.hit;
        return k <= 0 ? -10 : 0.6 * k + 0.55 * k * k;
      };

      // the final drop: falls through the rain in slow motion onto the cracked bed
      const HERO_FROM = 1.15;
      function heroY(t) {
        const k = clamp01((t - T.heroIn) / (T.hit - T.heroIn));
        return IMP.y + HERO_FROM * (1 - k);
      }

      // camera
      const lagged = (t) => {
        const acc = V3();
        for (let k = 0; k <= 10; k++) acc.add(river3(headU(Math.max(0, t - 0.8 + k * 0.08))));
        return acc.multiplyScalar(1 / 11);
      };
      function dropPos(t) {
        const k = clamp01((t - T.dropStart) / (T.impact - T.dropStart));
        return V3(SRC3.x, lerp(14.6, SRC3.y + 0.3, k * k), SRC3.z);
      }
      const P = V3();
      const L = V3();
      function cameraAt(t) {
        const dp = dropPos(t);
        const p1 = V3(dp.x + 1.6, Math.max(dp.y + 4.6, 5.5), dp.z + 4.4);
        const l1 = V3(dp.x, Math.max(dp.y - 4.5, SRC3.y), dp.z - 0.5);
        const hl = lagged(t);
        const p2 = hl.clone().add(V3(4.2, 8.6, 9.8));
        const l2 = hl.clone().add(V3(0, 0, 1.6));
        const kd = win(t, T.wide1, 19.0);
        const p3 = V3(lerp(4, -5, kd), lerp(19, 15.5, kd), lerp(21, 19, kd));
        const l3 = V3(0, -1, 1);
        const kp = win(t, 20.2, 23.2);
        const p4 = IMP.clone().add(V3(lerp(2.6, 3.0, kp), lerp(12.5, 7.5, kp), lerp(15.5, 9.5, kp)));
        const l4 = IMP.clone().add(V3(0, 0, 0.8));
        // low on the bed, looking up into the rain, following the drop down
        const hy = t < T.heroIn ? IMP.y + HERO_FROM : heroY(t);
        const follow = clamp01((hy - IMP.y) / HERO_FROM);
        const p5 = IMP.clone().add(V3(-IMP_T.x * 1.3 + IMP_T.y * 0.18, 0.26, -IMP_T.y * 1.3 - IMP_T.x * 0.18));
        const l5 = IMP.clone().add(V3(IMP_T.x * 0.2, lerp(0.1, 0.62, follow), IMP_T.y * 0.2));
        const kr = Math.max(0, t - T.hit - 0.15);
        const centre = IMP.clone().lerp(V3(0, IMP.y, 0.5), win(t, T.hit + 1, 32));
        const p6 = centre.clone().add(V3(0, Math.min(27, 1.6 + 5.2 * kr + 1.4 * kr * kr), 0.02));
        const l6 = centre.clone();

        P.copy(p1).lerp(p2, sineInOut((t - 3.3) / 1.6));
        L.copy(l1).lerp(l2, sineInOut((t - 3.3) / 1.6));
        P.lerp(p3, sineInOut((t - T.wide0) / (T.wide1 - T.wide0)));
        L.lerp(l3, sineInOut((t - T.wide0) / (T.wide1 - T.wide0)));
        P.lerp(p4, sineInOut((t - 18.8) / 1.6));
        L.lerp(l4, sineInOut((t - 18.8) / 1.6));
        P.lerp(p5, sineInOut((t - 23.2) / 2.2));
        L.lerp(l5, sineInOut((t - 23.2) / 2.2));
        P.lerp(p6, sineInOut((t - (T.hit + 0.2)) / 1.0));
        L.lerp(l6, sineInOut((t - (T.hit + 0.2)) / 1.0));
        P.y = Math.max(P.y, height(P.x, P.z) + 0.14);
        camera.position.copy(P);
        const tilt = win(t, T.hit + 0.2, T.hit + 1.4);
        camera.up.set(0, 1 - tilt, -tilt).normalize();
        camera.lookAt(L);
      }

      const finalEl = document.getElementById("final");
      const ask1 = document.getElementById("ask1");
      const ask2 = document.getElementById("ask2");
      const play = document.getElementById("play");
      const logoEl = document.getElementById("logo");
      const partners = document.getElementById("partners");
      const grainEl = document.getElementById("grain");
      const veil = document.getElementById("veil");
      const qq = new THREE.Quaternion();
      const mm = new THREE.Matrix4();

      function renderAt(t) {
        t = Math.min(Math.max(t, 0), DURATION);
        lastT = t;
        if (!ready) return;
        colourScript(t);
        const tw = tau(t);
        G.uTime.value = t;
        G.uRing.value = ringR(t);
        G.uRingAmp.value = t > T.hit ? 0.8 * win(t, T.hit + 0.15, T.hit + 0.5) * (1 - 0.6 * win(t, T.hit + 3, T.hit + 8)) : 0;

        // ---- river ----
        const RV = W3.RV;
        const dry = win(t, T.dry0 + 0.3, 19.2);
        RV.uFlow.value = flowClock(t);
        RV.uA.value = 0;
        RV.uB.value = t > T.hit ? 1 : headU(t);
        RV.uW.value = lerp(1, 0.45, dry);
        RV.uDull.value = win(t, T.dry0 + 1, 21);
        RV.uFrag.value = t < T.frag0 ? -1 : lerp(-0.15, 1.15, win(t, T.frag0, T.frag1));
        RV.uGlow.value = (1 - win(t, 11.3, 12.2)) * win(t, 3.4, 3.8);
        RV.uOpacity.value = t < T.impact ? 0 : 1;
        const TU = W3.TU;
        TU.uHead.value = t > T.hit ? 1 : headU(t);
        TU.uWHalf.value = RIVER_HALF * RV.uW.value;
        TU.uFrag.value = RV.uFrag.value;
        TU.uBedCrack.value = win(t, 18.5, 23.5);
        TU.uRain.value = 0.55 * win(t, T.rain0 + 0.3, T.hit);

        // ---- the five roles glow, then go out one by one ----
        ROLES.forEach((k) => {
          const pg = W3.placeGlows[k];
          const t0 = WORD_T[k];
          pg.material.opacity = 0.35 * win(t, t0, t0 + 0.3) * (1 - win(t, t0 + 0.6, t0 + 1.6));
        });

        // ---- animals ----
        for (const a of W3.animals) {
          const life = win(t, a.wake, a.wake + 1.2) * (1 - 0.7 * win(t, a.dry + 1, a.dry + 3));
          const lt = a.ph + t;
          const walk = a.mode === "walk" ? life : 0;
          const weights = { Idle_Headlow: 1 - life, Eating: a.mode === "graze" ? life : 0, Walk: walk };
          for (const nm in a.acts) {
            const act = a.acts[nm];
            const w = weights[nm] || 0;
            act.setEffectiveWeight(w);
            act.time = (lt * (nm === "Walk" ? 0.8 : 1)) % act.getClip().duration;
          }
          a.mixer.update(0);
          const step = a.mode === "walk" ? 0.32 * Math.sin((t - a.wake) * 0.35 * walk + a.ph) : 0;
          const ax = a.base.x + Math.cos(a.rot) * step * walk;
          const az = a.base.z - Math.sin(a.rot) * step * walk;
          a.obj.position.set(ax, height(ax, az) - 0.01, az);
          a.obj.visible = t < T.hit + 0.1 || t > T.hit + 1.0;
        }

        // ---- ducks drift on the river, leave when it breaks up ----
        const dl = win(t, WORD_T.volaille, WORD_T.volaille + 1) * (1 - win(t, 20.0, 20.8));
        W3.ducks.forEach((d, i) => {
          const u = W3.duckU + d.off + 0.004 * Math.sin(t * 0.3 + d.ph);
          const p = river2d.getPointAt(clamp01(u));
          const p2 = river2d.getPointAt(clamp01(u + 0.002));
          const nx = -(p2.y - p.y);
          const nz = p2.x - p.x;
          const nl = Math.hypot(nx, nz) || 1;
          const side = 0.35 * Math.sin(d.ph * 2.1) * RV.uW.value;
          d.obj.position.set(p.x + (nx / nl) * side, heightD(p.x, p.y, 0) + 0.17 + 0.01 * Math.sin(t * 3 + i), p.y + (nz / nl) * side);
          d.obj.rotation.y = -Math.atan2(p2.y - p.y, p2.x - p.x) + Math.PI;
          d.obj.scale.setScalar(Math.max(0.001, dl));
          d.obj.visible = dl > 0.01;
        });

        // ---- drops ----
        const drop = W3.drop;
        let dVis = false;
        let dpos = V3();
        let ds = 0.22;
        let stretch = 1.15;
        if (t < T.impact) {
          dVis = t >= T.dropStart - 0.2;
          dpos = dropPos(t);
        } else if (t >= T.heroIn - 0.4 && t < T.hit) {
          dVis = true;
          dpos = V3(IMP.x, heroY(t), IMP.z);
          ds = 0.045;
          stretch = 1.05 + 0.08 * Math.sin(tw * 22);
        }
        drop.visible = dVis;
        drop.position.copy(dpos);
        drop.scale.set(ds * (2.1 - stretch), ds * stretch, ds * (2.1 - stretch));
        W3.dropGlow.visible = dVis;
        W3.dropGlow.position.copy(dpos);
        W3.dropGlow.scale.setScalar(t < T.impact ? 1.2 : 0.22);
        W3.dropGlow.material.opacity = t < T.impact ? 0.55 : 0.5;
        W3.headGlow.position.copy(river3(headU(t)));
        W3.headGlow.material.opacity = 0.7 * win(t, 3.45, 3.8) * (1 - win(t, 11.2, 11.6));
        const sk = clamp01((t - T.impact) / 0.8);
        W3.splash.position.copy(SRC3);
        W3.splash.scale.setScalar(0.1 + 1.6 * sk);
        W3.splash.material.opacity = t > T.impact && t < T.impact + 0.8 ? 0.8 * (1 - sk) : 0;

        // crown splash in slow motion
        const ct = t > T.hit ? tw - tau(T.hit) : -1;
        W3.crown.visible = ct > 0 && ct < 0.7;
        if (W3.crown.visible) {
          W3.crownSeeds.forEach((sd, i) => {
            const r = 0.02 + sd.v * ct * 0.9;
            const y = IMP.y + 0.01 + sd.up * ct * 1.1 - 4.9 * ct * ct;
            const sc = sd.s * (1 - clamp01((ct - 0.45) / 0.25));
            mm.compose(V3(IMP.x + Math.cos(sd.a) * r, Math.max(IMP.y, y), IMP.z + Math.sin(sd.a) * r), qq, V3(sc, sc, sc));
            W3.crown.setMatrixAt(i, mm);
          });
          W3.crown.instanceMatrix.needsUpdate = true;
        }
        const cr = W3.crownRing;
        cr.visible = ct > 0 && ct < 0.5;
        cr.position.set(IMP.x, IMP.y + 0.02 + 0.025 * Math.min(ct, 0.2), IMP.z);
        cr.scale.set(0.03 + ct * 0.35, 0.05 * Math.sin(Math.min(1, ct / 0.45) * Math.PI), 0.03 + ct * 0.35);
        cr.material.opacity = 0.6 * (1 - clamp01(ct / 0.5));

        // ---- rain ----
        const RU = W3.RU;
        RU.uTau.value = tw;
        const sp = t > 25.2 && t < 28.1 ? (tau(t + 0.01) - tw) / 0.01 : 1;
        RU.uLen.value = lerp(0.06, 0.38, clamp01(sp));
        RU.uOpacity.value = 0.42 * win(t, T.rain0, T.rain0 + 0.8) * (1 - win(t, T.hit + 0.6, T.hit + 2.2));
        RU.uCenter.value.set(camera.position.x, IMP.y - 0.2, camera.position.z);
        W3.rain.visible = RU.uOpacity.value > 0.001;

        W3.bloom.strength = lerp(0.35, 0.45, win(t, T.hit, T.hit + 0.5));
        cameraAt(t);
        RU.uCenter.value.set(camera.position.x, IMP.y - 0.2, camera.position.z);
        W3.composer.render();

        // ---- the final title, born from the ripple ----
        const fo = win(t, T.logo, T.logo + 0.8);
        finalEl.style.opacity = String(fo);
        veil.style.opacity = String(win(t, T.logo - 0.3, T.logo + 0.9));
        logoEl.style.transform = "scale(" + (0.94 + 0.06 * fo).toFixed(4) + ")";
        logoEl.style.filter = "blur(" + ((1 - fo) * 8).toFixed(2) + "px)";
        ask1.style.opacity = String(win(t, T.ask1, T.ask1 + 0.6));
        ask2.style.opacity = String(win(t, T.ask2, T.ask2 + 0.6));
        play.style.opacity = String(win(t, T.play, T.play + 0.5));
        partners.style.opacity = String(0.95 * win(t, T.partners, T.partners + 0.5));
        partners.style.transform = "translateX(-50%) translateY(" + ((1 - win(t, T.partners, T.partners + 0.5)) * 14).toFixed(2) + "px)";

        const f = Math.floor(t * FPS + 1e-6);
        const h = Math.imul(f + 1, 2654435761) >>> 0;
        grainEl.style.backgroundPosition = (h % 256) + "px " + ((h >>> 8) % 256) + "px";
      }

      const clock = gsap.timeline({ paused: true });
      clock.set({}, {}, DURATION);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = clock;
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.valley = Promise.all(jobs).then(() => {
        build();
        IMP = V3(IMP2.x, heightD(IMP2.x, IMP2.y, 0), IMP2.y);
        G.uImpact.value.set(IMP2.x, IMP2.y);
        const s = river2d.getPointAt(0.02);
        SRC3 = V3(s.x, heightD(s.x, s.y, 0) + 0.16, s.y);
        ready = true;
        renderAt(window.__hfThreeTime || lastT);
      });
    </script>
  </body>

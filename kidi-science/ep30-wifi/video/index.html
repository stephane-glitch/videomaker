      cap("… puis des ondes jusqu'à toi", 1340, 780, t, tOn, { t1: tMp, fs: 40, rot: 2 }) +
      cap("les devoirs d'abord !", 1300, 760, t, tDe, { t1: tEnd, rot: 3 }) +
      (pop(t, tEnd, 0.5) > 0 ? `<g transform="translate(960 300) rotate(-2) scale(${pop(t, tEnd, 0.5).toFixed(3)})"><rect x="-370" y="-76" width="760" height="170" rx="14" fill="#07122e" opacity=".35"/><rect x="-380" y="-86" width="760" height="170" rx="14" fill="${ACC.cream}"/><text x="0" y="36" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="108" fill="#1c438a">Kidi-science</text></g>` + cap("À bientôt pour une nouvelle question !", 960, 470, t, tEnd + 0.6, { fs: 46, rot: 1.5 }) : logo()),
  });
}

// Chaque image : formes hachurées (redessinées une image sur trois), ondes, personnages, étiquettes.
{
  const lab = document.getElementById("lab"),
    grain = document.getElementById("grain"),
    dip = document.getElementById("dip");
  const draw = (time) => {
    const im = Math.floor(time * 30 + 1e-4),
      s3 = Math.floor(im / 3),
      tq = s3 / 10;
    let S = SC[SC.length - 1];
    for (const s of SC)
      if (time < s.b) {
        S = s;
        break;
      }
    const c = S.cam(time),
      srcs = S.waves(tq);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = RAMP[4];
    ctx.fillRect(0, 0, 1920, 1080);
    drawForms(S, c, tq, s3, srcs);
    setCam(c, 1);
    S.figs(time, im, tq, s3, srcs, c);
    lab.innerHTML = S.over(time);
    const d = Math.min(S.a > 0 ? lin(time, S.a, S.a + 0.25) : 1, S === SC[SC.length - 1] ? 1 : lin(S.b - time, 0, 0.25));
    dip.style.opacity = (1 - d).toFixed(3);
    grain.style.transform = `translate(${f1((rnd(s3 * 1.3) - 0.5) * 100)}px,${f1((rnd(s3 * 2.1 + 5) - 0.5) * 100)}px)`;
  };
  const tl = gsap.timeline({ paused: true });
  const tick = { v: 0 };
  tl.fromTo(tick, { v: 0 }, { v: 1, duration: SCHED.total, ease: "none", onUpdate: () => draw(tl.time()) }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
  draw(0);
}

<!doctype html>
<html lang="fr" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Kidi-science — Comment marche une voiture ?</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Fredoka";
        font-weight: 500;
        src: url("assets/fonts/fredoka-500.woff2") format("woff2");
      }
      @font-face {
        font-family: "Fredoka";
        font-weight: 600;
        src: url("assets/fonts/fredoka-600.woff2") format("woff2");
      }
      @font-face {
        font-family: "Fredoka";
        font-weight: 700;
        src: url("assets/fonts/fredoka-700.woff2") format("woff2");
      }
      :root {
        --paper: #fff8ec;
        --ink: #1f2a44;
        --blue: #2f5bd3;
        --blue-l: #5f86f0;
        --blue-d: #1e3f9e;
        --fire: #ff8a1f;
        --hot: #ffd23f;
        --spark: #ffe14d;
        --air: #8fd3ff;
        --smoke: #a7afba;
        --sub: #55607a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #fff8ec;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Fredoka", sans-serif;
        color: var(--ink);
        background: #fff8ec;
      }
      .clip,
      .in {
        position: absolute;
        inset: 0;
      }
      .abs {
        position: absolute;
      }
      svg {
        display: block;
        overflow: visible;
      }
      .stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      .ink {
        stroke: #1f2a44;
        stroke-width: 4;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      #bg-paper {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 75% 75% at 50% 45%, #fffdf7 0%, #fcefd9 100%);
      }
      #bg-dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, rgba(31, 42, 68, 0.07) 2px, transparent 2.5px);
        background-size: 36px 36px;
      }
      /* pastilles : logo et chapitre */
      .logo-pill {
        position: absolute;
        left: 64px;
        top: 52px;
        height: 72px;
        padding: 0 30px;
        border-radius: 36px;
        background: #fff;
        border: 3.5px solid var(--ink);
        display: flex;
        align-items: center;
        font-size: 42px;
        font-weight: 700;
        white-space: nowrap;
      }
      .logo-pill .d {
        color: var(--fire);
      }
      .logo-pill .s {
        color: var(--blue);
      }
      .chap {
        position: absolute;
        right: 64px;
        top: 52px;
        height: 72px;
        padding: 0 38px;
        border-radius: 36px;
        background: var(--ink);
        color: #fff;
        display: flex;
        align-items: center;
        font-size: 36px;
        font-weight: 600;
        white-space: nowrap;
      }
      /* étiquettes */
      .lab {
        position: absolute;
        white-space: nowrap;
      }
      .lab .lt {
        font-size: 40px;
        font-weight: 600;
        line-height: 1.1;
      }
      .lab .ls {
        font-size: 30px;
        font-weight: 500;
        color: var(--sub);
        line-height: 1.2;
      }
      .lab.r {
        text-align: right;
      }
      .big {
        font-size: 84px;
        font-weight: 700;
        line-height: 1.05;
      }
      .note {
        position: absolute;
        background: #fff;
        border: 3.5px solid var(--ink);
        border-radius: 26px;
        padding: 16px 28px;
        font-size: 38px;
        font-weight: 600;
        white-space: nowrap;
      }
      .panel {
        position: absolute;
        background: #fff;
        border: 3.5px solid var(--ink);
        border-radius: 34px;
        overflow: hidden;
      }
      /* barre d'étapes (les 4 temps) */
      .steps {
        position: absolute;
        left: 0;
        right: 0;
        top: 950px;
        display: flex;
        justify-content: center;
        gap: 26px;
      }
      .stp {
        width: 270px;
        height: 78px;
        border-radius: 39px;
        background: #fff;
        border: 3.5px solid var(--ink);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 16px;
        font-size: 36px;
        font-weight: 600;
      }
      .stp b {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 3px solid var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 700;
        flex: none;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="{{TOTAL}}" data-track-index="0">
        <div id="bg-paper"></div>
        <div id="bg-dots"></div>
      </div>

{{SCENES}}

{{AUDIO}}
    </div>

    <script>
      const SCHED = {{SCHED}};

{{JS}}
    </script>
  </body>
</html>

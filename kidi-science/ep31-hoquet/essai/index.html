// Moteur « papier découpé », deuxième version.
// Chaque morceau de papier est fabriqué une fois en image (grain, déchirure) avec, à part, son ombre portée.
// À chaque pose, le morceau bouge et son ombre s'écarte et s'adoucit quand il se soulève du carton.
const TAU = Math.PI * 2;
const FPS = 15; // « sur deux » ; les actions très rapides passent « sur un » (voir `ones`)
const rnd = (i) => {
  const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
};
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const ease = (u) => u * u * (3 - 2 * u);
const E = (t, a, b) => ease(lin(t, a, b));
const lerp = (a, b, u) => a + (b - a) * u;
const f1 = (v) => v.toFixed(1);
const hashStr = (s) => {
  let a = 5381,
    b = 52711;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    a = (a * 33) ^ c;
    b = (b * 33) ^ c;
  }
  return (a >>> 0).toString(36) + (b >>> 0).toString(36);
};

  for (let i = 0; i < n; i++) d += `Q${f1(pts[i][0])} ${f1(pts[i][1])} ${f1(m(i)[0])} ${f1(m(i)[1])}`;

  for (let i = 0; i < seg.length; i++) {
    if (d <= seg[i] || i === seg.length - 1) {

      return [lerp(cl[i][0], cl[i + 1][0], k), lerp(cl[i][1], cl[i + 1][1], k), (Math.atan2(cl[i + 1][1] - cl[i][1], cl[i + 1][0] - cl[i][0]) * 180) / Math.PI];

function P(o) {
  const pts = o.pts;

    y0 = Math.min(y0, y);
    x1 = Math.max(x1, x);
    y1 = Math.max(y1, y);
  }
  const pad = o.pad ?? 36,
    w = x1 - x0,
    h = y1 - y0,
    W = Math.ceil(w + 2 * pad),
    H = Math.ceil(h + 2 * pad);
  const loc = pts.map(([x, y]) => [x - x0, y - y0]);
  const d = o.smooth ? smoothD(loc) : poly(loc);
  uid++;
  const tear = o.torn ? ` filter="url(#tear${o.torn})"` : "";
  const stock = ` filter="url(#st-${o.stock || "fine"})"`;
  const extra = o.extra ? `<g clip-path="url(#cP)">${o.extra(w, h)}</g>` : "";
  const art = o.art ? `<g clip-path="url(#cP)"><g transform="translate(${f1(-x0)} ${f1(-y0)})">${o.art}</g></g>` : "";
  const free = o.free ? `<g transform="translate(${f1(-x0)} ${f1(-y0)})">${o.free}</g>` : "";
  const dk = o.dk || [-2, -6];
  const white = o.torn && o.deckle !== false ? `<path d="${d}" transform="translate(${dk[0]} ${dk[1]})" fill="#f6f0e2" stroke="#f6f0e2" stroke-width="${o.dw ?? 8}" stroke-linejoin="round" filter="url(#tearW)"/>` : "";
  const body = `<defs><clipPath id="cP"><path d="${d}"/></clipPath></defs>${white}<g${tear}><g${stock}><path d="${d}" fill="${o.fill}"/>${extra}${o.over ? o.over(w, h) : ""}${art}</g></g>${free}`;
  const head = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${-pad} ${-pad} ${W} ${H}">`;
  const html = head + (o.alpha ? `<g opacity="${o.alpha}">${body}</g>` : body) + "</svg>";
  const key = hashStr(html);
  const lift = o.lift ?? 6;
  const hasSh = lift > 0 || o.shadow;
  if (window.__BAKE) {
    window.__BAKE[key] = { html, shadow: "", w: W, h: H };
    if (hasSh) window.__BAKE[key + "s"] = { html: head + `<g filter="url(#toSh)" opacity="${o.alpha ? Math.min(1, o.alpha + 0.2) : 1}">${body}</g></svg>`, shadow: "", w: W, h: H };
  }
  const el = document.createElement("div");
  el.className = "pc";
  el.style.left = f1(x0 - pad) + "px";

  el.style.width = W + "px";
  el.style.height = H + "px";
  const piv = o.pivot ? [o.pivot[0] - x0 + pad, o.pivot[1] - y0 + pad] : [w / 2 + pad, h / 2 + pad];
  el.style.transformOrigin = `${f1(piv[0])}px ${f1(piv[1])}px`;
  el.innerHTML = (hasSh ? `<img class="sh" src="assets/pieces/${key}s.png" width="${W}" height="${H}" alt="">` : "") + `<img src="assets/pieces/${key}.png" width="${W}" height="${H}" alt="">`;
  const S = o.layer === "fixed" ? FIXED : CUR;
  S.layers[o.layer === "fixed" ? "fixed" : o.layer || "world"].el.appendChild(el);
  const size = Math.max(w, h);
  const p = {
    el,
    sh: hasSh ? el.firstChild : null,
    seed: o.seed ?? uid * 7.3,
    rot: o.rot || 0,
    lift,
    jmp: o.jmp ?? (size > 1200 ? 0.15 : 1),
    tin: o.tin,
    tout: o.tout,
    from: o.from || [0, -50, 10],
    anim: o.anim,
    show: o.show,

  return p;
}

const LCOL = [

function letters(text, x, y, o = {}) {
  const k = (o.size ?? 78) / 78;

        tout: o.tout != null ? o.tout + i * (o.dto ?? 0) : undefined,
        snd: i % 3 === 0 ? o.snd || "tic" : false,

// Caméra : liste de [temps, {x, y, z}] (x, y = point visé au centre de l'image), reliés en douceur
function camKeys(keys) {
  return (t) => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++)
      if (t <= keys[i][0]) {
        const u = keys[i][2] === "lin" ? lin(t, keys[i - 1][0], keys[i][0]) : E(t, keys[i - 1][0], keys[i][0]);
        const a = keys[i - 1][1],
          b = keys[i][1];
        return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: lerp(a.z, b.z, u) };
      }
    return keys[keys.length - 1][1];
  };
}

const JUMP = [0, 1, 0.86, 0.55, 0.25, 0.08, 0];
// times : liste d'instants, ou de paires [instant, force]
const jumpAt = (times) => (t) => {
  let j = 0;
  for (const e of times) {
    const [t0, a] = Array.isArray(e) ? e : [e, 1],
      k = Math.floor((t - t0) * 30 + 1e-4);
    if (k >= 0 && k < JUMP.length * 2) j = Math.max(j, a * (JUMP[Math.floor(k / 2)] ?? 0));
  }
  return j;
};

    tFerme = cue("c-2", "ferme"),
    tHic = cue("c-3", "Hic"),
    B0 = T("b");
  S.jump = jumpAt([[tCoup, 0.45], tHic]);
  S.shake = (t, st) => {
    const j = S.jump(t);
    return [(rnd(st * 2.3) - 0.5) * 30 * j, -20 * j];
  };
  S.ones = (t) => (t > tCoup - 0.05 && t < tCoup + 0.35) || (t > tFerme - 0.05 && t < tFerme + 0.3) || (t > tHic - 0.05 && t < tHic + 0.4);
  S.cam = camKeys([
    [B0, { x: 960, y: 545, z: 1.0 }],
    [tDia - 0.3, { x: 960, y: 560, z: 1.03 }, "lin"],
    [tDia + 0.6, { x: 930, y: 800, z: 1.55 }],
    [tRes - 0.2, { x: 932, y: 790, z: 1.58 }, "lin"],
    [tRes + 0.9, { x: 945, y: 640, z: 1.2 }],
    [tContr - 0.5, { x: 945, y: 645, z: 1.24 }, "lin"],
    [tContr + 0.15, { x: 930, y: 770, z: 1.5 }],
    [tPorte - 0.5, { x: 932, y: 740, z: 1.54 }, "lin"],
    [tPorte + 0.4, { x: 960, y: 410, z: 2.05 }],
    [tHic - 0.12, { x: 958, y: 412, z: 2.1 }, "lin"],
    [tHic + 0.25, { x: 960, y: 560, z: 1.06 }],
    [SCHED.total, { x: 960, y: 560, z: 1.1 }, "lin"],
  ]);
  // la respiration : 0 = poumons vides, 1 = pleins, 1,3 = le hoquet
  const breath = (t) => {
    const calm = (x) => 0.2 + 0.16 * Math.sin((x - B0) * 1.9);
    if (t < tDesc - 0.2) return calm(t);
    if (t < tEntre + 0.5) return lerp(calm(tDesc - 0.2), 1, E(t, tDesc - 0.2, tEntre + 0.4));
    const relax = (x) => lerp(1, calm(x), E(x, tEntre + 0.5, tEntre + 2.2));
    if (t < tCoup) return relax(t);
    const k = (t - tCoup) * 30,
      base = relax(tCoup);
    if (k < 2) return lerp(base, 1.3, k / 2);
    if (t < tHic + 0.6) return 1.25 + 0.05 * Math.sin(t * 30);
    return lerp(1.25, calm(t), E(t, tHic + 0.6, tHic + 2));
  };
  const STATES = [0, 0.25, 0.5, 0.75, 1, 1.3];
  const state = (t) => {
    const b = breath(t);
    let best = 0;
    for (let i = 1; i < STATES.length; i++) if (Math.abs(STATES[i] - b) < Math.abs(STATES[best] - b)) best = i;
    return best;
  };
  const DX0 = 745,
    DX1 = 1095;
  const domeH = (b) => 88 - 72 * b;
  const domeY = (x, h) => {
    const u = clamp((x - DX0) / (DX1 - DX0));
    return lerp(874, 894, u) - h * Math.sin(Math.PI * u);
  };
  board("board");
  P({ pts: rect(330, 40, 1260, 1000, 4, 5), fill: "#f7f3e8", lift: 6, extra: dots("p-grid", 0.9), boil: 0.4, jmp: 0.2 });
  for (const [x, y] of [
    [372, 82],
    [1548, 82],
    [372, 998],
    [1548, 998],
  ])
    brass(x, y);
  const SKIN = "#f3c9a0";
  // le buste, de profil
  P({ pts: rect(850, 360, 120, 120, 3, 2), fill: SKIN, stock: "sugar", lift: 4 });
  P({ pts: [[820, 450], [880, 440], [960, 445], [1030, 470], [1080, 540], [1100, 650], [1095, 800], [1110, 900], [1118, 1010], [742, 1010], [735, 900], [730, 700], [745, 560], [780, 480]], smooth: true, fill: SKIN, stock: "sugar", lift: 7 });
  P({ pts: blob(900, 235, 150, 162, 30, 3, 0.02), smooth: true, fill: SKIN, stock: "sugar", lift: 7 });
  P({ pts: [[1036, 210], [1094, 270], [1040, 286]], fill: SKIN, stock: "sugar", lift: 5 });
  P({ pts: blob(858, 252, 26, 36, 12, 4, 0.04), smooth: true, fill: "#e0a87c", lift: 3 });
  P({ pts: [[760, 250], [748, 160], [800, 92], [900, 66], [1004, 86], [1056, 140], [1000, 128], [924, 150], [864, 196], [842, 262], [800, 306]], smooth: true, fill: "#5a3a26", torn: 2, deckle: false, lift: 6 });
  P({ pts: blob(1000, 205, 11, 13, 10, 2, 0.02), smooth: true, fill: INK, lift: 2 });
  P({ pts: blob(1012, 262, 24, 16, 10, 6, 0.04), smooth: true, fill: "#f4978e", alpha: 0.55, lift: 1 });
  // le chemin de l'air : bouche, gorge, trachée
  const CL = [[1040, 302], [1000, 306], [962, 318], [942, 350], [936, 400], [934, 450], [933, 500], [930, 550], [926, 600]];
  const AP = [[1150, 300], [1100, 300], ...CL, [924, 660]];
  P({ pts: strip(CL, 48, 34), fill: "#e98a9a", lift: 3, extra: dots("p-rings", 1) });
  P({ pts: blob(1040, 304, 20, 10, 12, 3, 0.03), smooth: true, fill: "#8a2f2a", lift: 2 });
  // l'estomac, plein de bulles de limonade
  P({ pts: blob(995, 962, 98, 66, 22, 6, 0.04), smooth: true, fill: "#f6a64a", lift: 4, over: (w, h) => `<path d="M${w * 0.25} ${h * 0.35}q${w * 0.25} -${h * 0.2} ${w * 0.5} 0" stroke="#fbd08a" stroke-width="8" fill="none" stroke-linecap="round"/>` });
  for (let i = 0; i < 5; i++) P({ pts: blob(0, 0, 6, 6, 8, i + 40, 0.05), smooth: true, fill: "#fff3d6", lift: 1, boil: 0, anim: (t) => ({ x: 940 + i * 26 + Math.sin(t * 3 + i) * 5, y: 1000 - ((t * 30 + i * 13) % 56) }) });
  // les poumons et le diaphragme : une forme de rechange par état de la respiration
  STATES.forEach((b, k) => {
    const h = domeH(b),
      rx = 150 + 14 * b,
      ry = 200 + 16 * b,
      cx = 925,
      cy = 682 + 8 * b;
    const pts = [];
    for (let i = 0; i < 34; i++) {
      const a = (i / 34) * TAU;
      let x = cx + Math.cos(a) * rx * (1 + (rnd(i + k * 50) - 0.5) * 0.04),
        y = cy + Math.sin(a) * ry * (1 + (rnd(i + 9 + k * 50) - 0.5) * 0.04);
      x = clamp(x, 752, 1086);
      y = Math.min(y, domeY(x, h) - 12);
      pts.push([x, y]);
    }
    let tree = "";
    const br = (x, y, a, l, n) => {
      if (n === 0) return;
      const x2 = x + Math.cos(a) * l,
        y2 = y + Math.sin(a) * l;
      tree += `<path d="M${f1(x)} ${f1(y)}L${f1(x2)} ${f1(y2)}" stroke="#c4546a" stroke-width="${n * 2.4}" stroke-linecap="round"/>`;
      br(x2, y2, a - 0.45, l * 0.7, n - 1);
      br(x2, y2, a + 0.45, l * 0.7, n - 1);
    };
    br(926, 600, Math.PI / 2, 50 + 14 * b, 4);
    P({ pts, smooth: true, fill: "#f49ab0", stock: "sugar", torn: 2, deckle: false, alpha: 0.9, lift: 5, extra: dots("p-alv", 1), art: tree, show: (t) => state(t) === k, boil: 0.5 });
    const cl = [];
    for (let i = 0; i <= 14; i++) {
      const x = DX0 - 8 + ((DX1 - DX0 + 16) * i) / 14;
      cl.push([x, domeY(x, h)]);
    }
    P({ pts: strip(cl, 30, 26), fill: "#c4543a", stock: "kraft", lift: 6, extra: dots("p-muscle", 1), show: (t) => state(t) === k, boil: 0.5 });
  });
  // les côtes, qui s'écartent quand on inspire
  for (let i = 0; i < 4; i++) {
    const y0 = 520 + i * 80,
      cl = [];
    for (let k = 0; k <= 8; k++) {
      const u = k / 8;
      cl.push([lerp(758, 1082, u), lerp(y0, y0 + 46, u) - 34 * Math.sin(Math.PI * u)]);
    }
    P({ pts: strip(cl, 22, 18), fill: "#f7efd8", alpha: 0.72, lift: 3, pivot: [758, y0], anim: (t) => ({ r: -2.2 * breath(t) }) });
  }
  // la glotte : une petite porte de papier, accrochée par une attache
  const door = (t) => {
    if (t < tFerme) return 78;
    const k = Math.floor((t - tFerme) * 30);
    if (k < 4) return [78, 30, -8, 3][k];
    if (t < tHic + 0.8) return 0;
    return 78 * E(t, tHic + 0.8, tHic + 1.6);
  };
  P({ pts: rect(910, 401, 54, 17, 2, 1), fill: "#f2b134", lift: 5, pivot: [916, 409], anim: (t) => ({ r: door(t) }), over: (w, h) => `<rect x="4" y="${h / 2 - 2}" width="${w - 8}" height="4" fill="#c98a1c"/>` });
  brass(916, 409, "world", 8);
  // les flèches d'air
  let uDoor = 0;
  for (let u = 0; u <= 1; u += 0.002)
    if (along(AP, u)[1] < 409) uDoor = u;
  for (let i = 0; i < 5; i++) {
    const a = arrowPts(-30, 0, 60, 0, 18);
    P({
      pts: a,
      fill: "#7cc3ea",
      lift: 6,
      pivot: [0, 0],
      boil: 0.6,
      anim: (t) => {
        let u = -1;
        if (t > tDesc - 0.2 && t < tEntre + 0.7) u = ((t - tDesc) * 0.3 + i * 0.2) % 1;
        else if (t > tEng - 0.2 && t < tFerme) u = ((t - tEng) * 1.25 + i * 0.2) % 1;
        else if (t >= tFerme && t < tHic + 0.5) u = uDoor - 0.05 - i * 0.055 + (Math.floor(t * 15) % 2) * 0.008;
        if (u < 0) return { o: 0 };
        const [x, y, r] = along(AP, u);
        return { x, y, r };
      },
    });
  }
  // les étiquettes (une seule à la fois, à l'écran)
  label(1150, 830, "le diaphragme", { tin: tDia + 0.15, tout: tEntre + 1.0 });
  label(1180, 190, "d'un coup !", { tin: tCoup + 0.05, tout: tPorte - 0.35, fill: "#2b2b2b", ink: "#ffd84a", rot: 3 });
  label(1060, 700, "une petite porte : la glotte", { tin: tPorte + 0.35, tout: tHic - 0.08, fs: 50 });
  letters("HIC!", 1170, 180, { layer: "fixed", size: 130, tin: tHic + 0.03, dt: 0.034, shift: 4, seed: 99, jmp: 0, snd: "pop", from: [0, -120, 30] });
}
label(1560, 975, "Kidi-science", { tin: T("b") + 0.5, snd: false, fs: 34, rot: -2, fill: "#2f5bd3", ink: "#fff6e0" });

      // ===== run.js =====
// Dessin pose par pose : on place chaque papier et son ombre selon le temps du film.
{
  const SHOTS = [
    { set: "A", b: T("g") },
    { set: "G", b: T("b") },
    { set: "B", b: Infinity },
  ];
  const WHIP = 0.16;
  const sets = document.getElementById("sets"),
    grain = document.getElementById("grain"),
    lamp = document.getElementById("lamp");
  const POP = [1, 0.42, -0.08, 0];
  const placePiece = (p, S, t, st) => {
    let x = 0,
      y = 0,
      r = p.rot,
      sx = 1,
      sy = 1,
      o = true,
      l = p.lift;
    if (p.tin != null) {
      const k = Math.floor((t - p.tin) * 15 + 1e-4);
      if (k < 0) o = false;
      else {
        const f = POP[k] ?? 0;
        x += p.from[0] * f;
        y += p.from[1] * f;
        r += p.from[2] * f;
        l += 36 * Math.max(0, f);
      }
    }
    if (o && p.tout != null && t >= p.tout) o = false;
    if (o && p.show && !p.show(t, st)) o = false;
    if (o && p.anim) {
      const a = p.anim(t, st);
      if (a) {
        x += a.x || 0;
        y += a.y || 0;
        r += a.r || 0;
        sx *= (a.s ?? 1) * (a.sx ?? 1);
        sy *= (a.s ?? 1) * (a.sy ?? 1);
        l += a.lift || 0;
        if (a.o === 0) o = false;
      }
    }
    if (!o) {
      if (p.last !== "h") p.el.style.visibility = "hidden";
      p.last = "h";
      return;
    }
    const j = S.jump ? S.jump(t) * p.jmp : 0;
    if (j) {
      y -= j * 26 * (0.6 + 0.8 * rnd(p.seed));
      l += j * 30;
      r += j * 7 * (rnd(p.seed + 3) - 0.5) * 2;
    }
    const b = Math.floor(st / 2);
    x += (rnd(p.seed + b * 3.1) - 0.5) * 2 * p.boil;
    y += (rnd(p.seed + b * 5.3 + 1) - 0.5) * 2 * p.boil;
    r += (rnd(p.seed + b * 7.7 + 2) - 0.5) * 2 * p.rb;
    const up = 1 + (l - p.lift) * 0.0016;
    const tr = `translate(${f1(x)}px,${f1(y)}px) rotate(${r.toFixed(2)}deg) scale(${(sx * up).toFixed(3)},${(sy * up).toFixed(3)})`;
    if (p.last === "h" || p.last === "") p.el.style.visibility = "inherit";
    if (p.last !== tr) p.el.style.transform = tr;
    p.last = tr;
    if (p.sh) {
      const st2 = `translate(${f1(LIGHT[0] * l * 0.8)}px,${f1(LIGHT[1] * l * 0.8)}px)`,
        op = clamp(0.6 - (l - 6) * 0.011, 0.2, 0.6).toFixed(2),
        bl = l > 14 ? `blur(${((l - 14) * 0.09).toFixed(1)}px)` : "none";
      if (p.shT !== st2) p.sh.style.transform = p.shT = st2;
      if (p.shO !== op) p.sh.style.opacity = p.shO = op;
      if (p.shB !== bl) p.sh.style.filter = p.shB = bl;
    }
  };
  const placeSet = (S, t, st, dx) => {
    S.root.style.visibility = "visible";
    S.root.style.transform = `translateX(${f1(dx)}px)`;
    const c = S.cam(t),
      [kx, ky] = S.shake ? S.shake(t, st) : [0, 0];
    for (const n in S.layers) {
      const { el, k } = S.layers[n],
        z = 1 + (c.z - 1) * k,
        fx = 960 + (c.x - 960) * k,
        fy = 540 + (c.y - 540) * k;
      el.style.transform = `translate(${f1(960 - z * fx + kx * k)}px,${f1(540 - z * fy + ky * k)}px) scale(${z.toFixed(4)})`;
    }
    for (const p of S.pieces) placePiece(p, S, t, st);
  };
  const draw = (time) => {
    const i = SHOTS.findIndex((s) => time < s.b);
    const S = SETS[SHOTS[i].set];
    const ones = (S.ones && S.ones(time)) || (i > 0 && time < SHOTS[i - 1].b + WHIP) || time > SHOTS[i].b - WHIP;
    const st = ones ? Math.floor(time * 30 + 1e-4) / 2 : Math.floor(time * 15 + 1e-4);
    const t = ones ? Math.floor(time * 30 + 1e-4) / 30 : st / 15;
    const sti = Math.floor(st);
    for (const n in SETS) SETS[n].root.style.visibility = "hidden";
    // passage d'un décor à l'autre : panoramique filé
    let blur = 0;
    if (i + 1 < SHOTS.length && t > SHOTS[i].b - WHIP) {
      const u = E(t, SHOTS[i].b - WHIP, SHOTS[i].b + WHIP);
      placeSet(S, t, sti, -1920 * u);
      placeSet(SETS[SHOTS[i + 1].set], t, sti, 1920 * (1 - u));
      blur = 10 * Math.sin(Math.PI * u);
    } else if (i > 0 && t < SHOTS[i - 1].b + WHIP) {
      const u = E(t, SHOTS[i - 1].b - WHIP, SHOTS[i - 1].b + WHIP);
      placeSet(SETS[SHOTS[i - 1].set], t, sti, -1920 * u);
      placeSet(S, t, sti, 1920 * (1 - u));
      blur = 10 * Math.sin(Math.PI * u);
    } else placeSet(S, t, sti, 0);
    sets.style.filter = blur > 0.5 ? `blur(${blur.toFixed(1)}px)` : "none";
    for (const p of FIXED.pieces) placePiece(p, FIXED, t, sti);
    // la caméra banc-titre : léger flottement, lampe qui vacille, grain
    const b = Math.floor(sti / 2);
    sets.style.transform = `translate(${f1((rnd(b * 1.7) - 0.5) * 2.2)}px,${f1((rnd(b * 2.3 + 4) - 0.5) * 2.2)}px)`;
    grain.style.transform = `translate(${f1((rnd(sti * 1.3) - 0.5) * 100)}px,${f1((rnd(sti * 2.1 + 5) - 0.5) * 100)}px)`;
    lamp.style.opacity = (0.92 + rnd(b * 1.9) * 0.08).toFixed(3);
  };
  const tl = gsap.timeline({ paused: true });
  const tick = { v: 0 };
  tl.fromTo(tick, { v: 0 }, { v: 1, duration: SCHED.total, ease: "none", onUpdate: () => draw(tl.time()) }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
  draw(0);
}

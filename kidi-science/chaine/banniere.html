<!doctype html>

    <style>
      @font-face {
        font-family: "Fredoka";

      #b {

        stroke: #1f2a44;

        stroke-linecap: round;
      }

        position: absolute;
      }
      .ico svg {

        height: 100%;
        overflow: visible;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 2560px;
        height: 1440px;
      }
      #box {
        position: absolute;
        left: 560px;
        top: 560px;

        height: 270px;

        white-space: nowrap;

        border: 3.5px solid #1f2a44;

    <script>
      // le kit de dessin de la série, chargé sans la partie « minutage »
      const SCHED = { lines: {}, scenes: {} };
      const gsap = { timeline: () => ({}) };
    </script>
    <script src="../ep07-allergies/video/src/js/kit.js"></script>
    <script>
      const R = (x, y, deg, s) => `<g transform="rotate(${deg} ${x} ${y})">${s}</g>`;
      let s = "";
      s +=
        R(300, 250, 0, gearSVG(300, 250, 120, 11, 0.2)) +
        gearSVG(470, 372, 62, 7, 0.5, C.fire, "#B85E00");
      s += earthSVG(1280, 250, 140, -20);
      s += R(1790, 300, 14, bulbSVG(1790, 290, 1, 0.95));
      s += sunSVG(2270, 280, 100, 0.4);
      // l'arc-en-ciel
      RAINBOW.forEach(
        (c, i) =>
          (s += `<path d="M${1310 + i * 22} 1330 A ${230 - i * 22} ${230 - i * 22} 0 0 1 ${1770 - i * 22} 1330" fill="none" stroke="${c}" stroke-width="22"/>`),
      );
      s += `<path d="M1299 1330 A 241 241 0 0 1 1781 1330 M1431 1330 A 109 109 0 0 1 1649 1330" fill="none" class="ink" stroke-width="5"/>`;
      // côté gauche : la fleur, le pollen, un globule blanc ; côté droit : le chat, le virus
      s += flowerSVG(250, 1010, 0.8) + pollenSVG(400, 600, 36, 0.3) + pollenSVG(130, 560, 24, 1);
      s += guardSVG(2250, 660, 96, 0, 0, -1) + virusSVG(2420, 520, 40, 0.3);
      s += catSVG(330, 1380, 1.25) + eyeSVG(2240, 1250, 1.0);
      // des ondes sonores
      for (let i = 0; i < 4; i++)
        s += `<path d="M${640 + i * 44} ${1130 - i * 30} Q${690 + i * 60} ${1230} ${640 + i * 44} ${1330 + i * 30}" fill="none" stroke="${C.blue}" stroke-width="12" stroke-linecap="round" opacity="${1 - i * 0.2}"/>`;
      document.getElementById("draw").innerHTML = s;
    </script>

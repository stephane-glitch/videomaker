<!doctype html>

    <!-- Bannière de la chaîne YouTube Kidi-science : 2560 × 1440. Tout le texte tient dans la zone sûre centrale (1546 × 423). -->
    <style>
      @font-face {
        font-family: "Fredoka";
        font-weight: 600;
        src: url("../ep07-allergies/video/assets/fonts/fredoka-600.woff2") format("woff2");
      }
      @font-face {
        font-family: "Fredoka";

        src: url("../ep07-allergies/video/assets/fonts/fredoka-700.woff2") format("woff2");
      }
      html,

        margin: 0;

      #b {
        position: relative;
        width: 2560px;
        height: 1440px;
        overflow: hidden;
        font-family: "Fredoka";
        color: #1f2a44;
        background: radial-gradient(ellipse 75% 75% at 50% 50%, #fffdf7 0%, #fcefd9 100%);
      }
      #dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, rgba(31, 42, 68, 0.07) 2.6px, transparent 3.2px);

      }
      .ink {
        stroke: #1f2a44;
        stroke-width: 4;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .ico {
        position: absolute;
      }
      .ico svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 2560px;
        height: 1440px;
      }
      .q {
        position: absolute;
        font-size: 50px;
        font-weight: 600;
        white-space: nowrap;
        background: #fff;
        border: 4px solid #1f2a44;
        border-radius: 40px;
        padding: 12px 34px;
      }
      .q::after {
        content: "";
        position: absolute;
        left: 34px;
        bottom: -19px;
        width: 30px;
        height: 30px;
        background: #fff;
        border-left: 4px solid #1f2a44;
        border-bottom: 4px solid #1f2a44;
        transform: skewX(-28deg) rotate(-18deg);
        border-bottom-left-radius: 6px;
      }
      #sub {
        position: absolute;
        left: 1340px;
        top: 850px;
        font-size: 38px;
        font-weight: 600;
        white-space: nowrap;
        background: #ffe14d;
        border: 3.5px solid #1f2a44;
        border-radius: 30px;
        padding: 6px 26px;
      }

  </head>

    <script>
      const R = (x, y, deg, s) => `<g transform="rotate(${deg} ${x} ${y})">${s}</g>`;
      let s = "";

        R(300, 250, 0, gearSVG(300, 250, 120, 11, 0.2)) +

      // l'arc-en-ciel
      RAINBOW.forEach(

      s += `<path d="M596 640 C 590 560, 650 536, 700 546 C 716 520, 760 526, 756 556 C 790 572, 792 614, 784 640 C 760 610, 720 596, 690 600 C 650 596, 620 610, 596 640 Z" fill="${C.ink}"/>`;
      s += `<circle cx="668" cy="652" r="11" fill="${C.ink}"/><circle cx="734" cy="646" r="11" fill="${C.ink}"/><circle cx="672" cy="648" r="4" fill="#fff"/><circle cx="738" cy="642" r="4" fill="#fff"/>`;
      s += `<path d="M648 626 Q666 616 684 626 M716 612 Q736 602 754 616" fill="none" class="ink" stroke-width="6"/><ellipse cx="704" cy="702" rx="11" ry="9" fill="${C.ink}"/><circle cx="640" cy="690" r="14" fill="#F7A8B8" opacity="0.7"/><circle cx="762" cy="684" r="14" fill="#F7A8B8" opacity="0.7"/>`;
      s += `<path d="M760 800 Q836 850 790 770 Q770 748 742 746" fill="none" stroke="${C.ink}" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/><path d="M760 800 Q836 850 790 770 Q770 748 742 746" fill="none" stroke="${C.blue}" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><circle cx="736" cy="744" r="22" fill="${SKIN}" class="ink"/>`;
      const Q = (x, y, size, rot, col) =>
        `<text x="${x}" y="${y}" transform="rotate(${rot} ${x} ${y})" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="${size}" fill="${col}" stroke="${C.ink}" stroke-width="6" paint-order="stroke">?</text>`;
      s +=
        Q(850, 600, 150, 12, C.fire) + Q(560, 590, 100, -16, C.spark) + Q(880, 700, 70, 20, C.air);
      document.getElementById("draw").innerHTML = s;
